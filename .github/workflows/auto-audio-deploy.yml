name: Auto Build Neural Audio & Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Force re-synthesize all audio clips from scratch'
        required: false
        default: false
        type: boolean

concurrency:
  group: pages-and-audio
  cancel-in-progress: false

jobs:
  build-audio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.finalize.outputs.commit_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for missing audio clips
        id: check
        shell: bash
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild }}
        run: |
          set -euo pipefail
          DRY_OUT="$(python3 scripts/build_neural_audio.py --dry-run)"
          echo "$DRY_OUT"
          MISSING="$(python3 -c '
          import re, sys
          out = sys.stdin.read()
          m = re.search(r"To synthesize:\s*(\d+)", out)
          if not m:
              raise SystemExit("ERROR: Could not parse \"To synthesize: <N>\" from dry-run output.")
          print(m.group(1))
          ' <<< "$DRY_OUT")"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ "$MISSING" -gt 0 ] || [ "$FORCE_REBUILD" = "true" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ffmpeg and edge-tts
        if: steps.check.outputs.needs_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 -m pip install --upgrade pip edge-tts

      - name: Synthesize missing neural French audio
        if: steps.check.outputs.needs_build == 'true'
        shell: bash
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild }}
        run: |
          set -euo pipefail
          if [ "$FORCE_REBUILD" = "true" ]; then
            python3 scripts/build_neural_audio.py --rebuild
          else
            python3 scripts/build_neural_audio.py
          fi

      - name: Commit and push updated audio packs
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- data/audio_packs data/audio_manifest.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data/audio_packs data/audio_manifest.js
            git commit -m "chore(audio): auto-generate missing neural French clips [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-pages:
    needs: build-audio
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout updated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-audio.outputs.commit_sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
