      function countFrenchWords(text) {
        const cleaned = String(text || '').trim();
        if (!cleaned) return 0;
        // Strip standalone French punctuation tokens (? ! : ; « ») so spaced punctuation isn't counted as extra words
        return cleaned
          .split(/\s+/)
          .map((tok) => tok.replace(/^[\p{P}\p{S}]+|[\p{P}\p{S}]+$/gu, ''))
          .filter(Boolean).length;
      }

      function getEETask3Split(text) {
        const paras = String(text || '').trim().split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
        if (paras.length === 0) return { part1Words: 0, part2Words: 0, hasTwoParts: false };
        if (paras.length === 1) return { part1Words: countFrenchWords(paras[0]), part2Words: 0, hasTwoParts: false };
        return {
          part1Words: countFrenchWords(paras[0]),
          part2Words: countFrenchWords(paras.slice(1).join(' ')),
          hasTwoParts: true
        };
      }

      function analyzeWritingCLB7(text, task) {
        const wc = countFrenchWords(text);
        const lower = String(text || '').toLowerCase();
        const paragraphs = text.split(/\n\s*\n/).filter((p) => p.trim().length > 0).length;

        const matchPhrases = (list) => list.filter((p) => {
          const escaped = p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/['’]/g, "['’]");
          return new RegExp(`(^|[^\\p{L}])${escaped}($|[^\\p{L}])`, 'iu').test(lower);
        });

        const casualConnectors = matchPhrases(['d’abord', 'ensuite', 'puis', 'en plus', 'mais', 'par contre', 'alors', 'donc', 'en fait', 'finalement']);
        const formalConnectors = matchPhrases([
          'tout d’abord', 'de plus', 'en effet', 'cependant', 'pourtant', 'toutefois', 'en revanche',
          'certes', 'néanmoins', 'malgré', 'grâce à', 'à cause de', 'par conséquent', 'ainsi',
          'en somme', 'en conclusion', 'alors que', 'tandis que', 'd’autant plus que'
        ]);
        const connectorsFound = [...new Set([...casualConnectors, ...formalConnectors])];

        // Strict word-boundary checks for B2 markers (no false positives like 'aient' matching 'étaient')
        const b2Regexes = [
          { label: 'bien que', re: /\bbien\s+qu[e’']/iu },
          { label: 'quoique', re: /\bquoiqu[e’']/iu },
          { label: 'il faut que', re: /\bil\s+faut\s+qu[e’']/iu },
          { label: 'il est essentiel/indispensable que', re: /\bil\s+est\s+(?:essentiel|indispensable|important)\s+qu[e’']/iu },
          { label: 'afin que / pour que', re: /\b(?:afin|pour)\s+qu[e’']/iu },
          { label: 'subj. irrégulier (soit/fasse/puisse/ait)', re: /(?:^|[^\p{L}])(?:soit|soient|soyons|soyez|fasse|fassions|puisse|puissent|ait|aient|aille|aillent)(?=$|[^\p{L}])/iu },
          { label: 'tout en + -ant', re: /\btout\s+en\s+\p{L}+ant(?=$|[^\p{L}])/iu },
          { label: 'cadre B2 (pour ma part / j’estime / il convient)', re: /(?:pour\s+ma\s+part|j['’]estime\s+que|il\s+convient\s+de|force\s+est\s+de\s+constater)/iu },
          { label: 'conditionnel', re: /(?:^|[^\p{L}])(?:pourrait|pourraient|devrait|devraient|serait|seraient|faudrait|aimerais|voudrais|aurait\s+dû)(?=$|[^\p{L}])/iu }
        ];
        // Guard subj. irrégulier: require a 'que' trigger in the text so 'ils avaient' isn't even possible (and 'ait/aient' needs 'que')
        const hasQue = /\bqu[e’']|\bqui\b/iu.test(lower);
        const b2Markers = b2Regexes
          .filter((item) => item.label.startsWith('subj.') ? (hasQue && item.re.test(lower)) : item.re.test(lower))
          .map((item) => item.label);

        const inRange = wc >= task.minWords && wc <= task.maxWords;
        const tips = [];
        let readiness = 20;

        if (wc < task.minWords) {
          tips.push(`Too short (${wc} words). Aim for ${task.minWords}–${task.maxWords} words—under-length essays lose heavy TCF points.`);
          if (wc >= task.minWords * 0.75) readiness += 15;
        } else if (wc > task.maxWords) {
          tips.push(`Slightly over limit (${wc} words vs max ${task.maxWords}). Tighten phrasing to avoid penalties.`);
          readiness += 20;
        } else {
          tips.push(`Word count (${wc} words) is right inside the TCF sweet spot (${task.minWords}–${task.maxWords})!`);
          readiness += 30;
        }

        if (task.taskNum === 'Tâche 1') {
          const hasGreeting = /(bonjour|salut|coucou|cher|chère)/iu.test(lower);
          const hasClosing = /(à bientôt|à très vite|amicalement|bises|dis-moi|réponds-moi)/iu.test(lower);
          const hasInformalQ = /(\btu\b|\bt['’]|ton\b|ta\b|tes\b|est-ce que tu)/iu.test(lower);
          const tooFormal = matchPhrases(['en somme', 'force est de constater', 'par conséquent', 'néanmoins', 'cordialement']);
          if (hasGreeting) readiness += 15;
          else tips.push('Add a natural informal greeting (Salut…, Coucou…).');
          if (hasClosing) readiness += 15;
          else tips.push('End with a friendly sign-off (À très vite, Dis-moi si tu peux venir !).');
          if (hasInformalQ) readiness += 10;
          else tips.push('Tâche 1 is an informal message to a friend/relative—use natural « tu » phrasing.');
          if (tooFormal.length > 0) tips.push(`Register check: avoid stiff academic phrasing (${tooFormal.join(', ')}) in a casual Tâche 1 message.`);
          else readiness += 10;
        } else if (task.taskNum === 'Tâche 2') {
          const hasPast = /(hier|la semaine dernière|récemment|j['’]ai|nous avons|c['’]était|il faisait|il y avait)/iu.test(lower);
          const hasRec = /(je recommande|je conseille|vous devriez|n['’]hésitez pas|vaut vraiment|à ne pas manquer)/iu.test(lower);
          if (paragraphs >= 2) readiness += 10;
          else tips.push('Split into clear paragraphs: Hook/Context → Story (PC + Imparfait) → Recommendation.');
          if (hasPast) readiness += 15;
          else tips.push('Include past narrative markers (Passé Composé + Imparfait scene-setting).');
          if (hasRec) readiness += 15;
          else tips.push('Add a clear recommendation for readers (Je recommande vivement…, Vous ne le regretterez pas).');
          if (connectorsFound.length >= 2) readiness += 10;
          else tips.push('Add 2–3 smooth connectors (D’abord, Ensuite, En effet, Malgré).');
        } else {
          // Tâche 3 (Dual-viewpoint synthesis + opinion)
          const split = getEETask3Split(text);
          const hasSynthesis = /(document|premier|second|deuxième|tandis que|alors que|selon|met en avant|souligne)/iu.test(lower);
          if (paragraphs >= 2) readiness += 10;
          else tips.push('Split clearly into 2 paragraphs: Paragraph 1 = Neutral Synthesis (40–60 words), Paragraph 2 = Opinion (80–120 words).');
          if (split.hasTwoParts && (split.part1Words < 35 || split.part1Words > 65)) {
            tips.push(`Part 1 synthesis is ${split.part1Words} words (target 40–60 words). Keep Part 1 concise and neutral.`);
          } else if (split.hasTwoParts) {
            readiness += 10;
          }
          if (hasSynthesis) readiness += 10;
          else tips.push('In Part 1, contrast both viewpoints neutrally (Alors que le premier…, le second souligne…).');
          if (formalConnectors.length >= 3) readiness += 10;
          else tips.push('Add 3+ B2 connectors (Tout d’abord, Certes, Toutefois, En revanche, Par conséquent, En somme).');
          if (b2Markers.length >= 2) readiness += 10;
          else tips.push('Add 1–2 B2 structures: a subjunctive (Bien que… soit / Il convient de…) or Conditionnel (il faudrait / ce serait).');
        }

        readiness = Math.min(100, readiness);
        return { wc, inRange, paragraphs, connectorsFound, b2Markers, readiness, tips };
      }

      function startEOTimer(task) {
        clearTimers();
        if (task.prepSec > 0) {
          state.eoTimerPhase = 'prep';
          state.eoTimeLeft = task.prepSec;
        } else {
          state.eoTimerPhase = 'speak';
          state.eoTimeLeft = task.speakSec;
        }
        state.eoTimerHandle = setInterval(() => {
          state.eoTimeLeft--;
          const el = document.getElementById('eoTimerReadout');
          if (el) el.textContent = formatTime(state.eoTimeLeft);
          if (state.eoTimeLeft <= 0) {
            if (state.eoTimerPhase === 'prep') {
              state.eoTimerPhase = 'speak';
              state.eoTimeLeft = task.speakSec;
              renderOutputView();
            } else {
              clearTimers();
              state.eoTimerPhase = 'done';
              renderOutputView();
            }
          }
        }, 1000);
        renderOutputView();
      }

      function toggleSpeechRecognition() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          showSpeechWarn('Live speech-to-text requires Chrome or Edge. You can still use the official timers & listen/shadow the B2 model responses!');
          return;
        }
        if (state.eoRecording && state.eoRecognition) {
          state.eoRecognition.stop();
          state.eoRecording = false;
          renderOutputView();
          return;
        }
        try {
          stopAudio();
          const rec = new SR();
          rec.lang = 'fr-CA';
          rec.continuous = true;
          rec.interimResults = true;
          rec.onresult = (e) => {
            let txt = '';
            for (let i = 0; i < e.results.length; i++) {
              txt += e.results[i][0].transcript + ' ';
            }
            state.eoTranscript = txt.trim();
            const box = document.getElementById('eoTranscriptBox');
            if (box) box.value = state.eoTranscript;
          };
          rec.onerror = () => {
            state.eoRecording = false;
            renderOutputView();
          };
          rec.onend = () => {
            state.eoRecording = false;
            renderOutputView();
          };
          rec.start();
          state.eoRecognition = rec;
          state.eoRecording = true;
          renderOutputView();
        } catch (err) {
          showSpeechWarn('Could not start microphone transcription in this browser context.');
        }
      }

      function stopVoiceRecording() {
        if (state.eoMediaRecorder && state.eoMediaRecorder.state !== 'inactive') {

        }
        state.eoVoiceRecording = false;
      }

      async function toggleVoiceRecorder() {
        if (state.eoVoiceRecording) {
          stopVoiceRecording();
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
          showSpeechWarn('Voice recording (MediaRecorder) is unavailable in this browser or context (requires HTTPS or localhost).');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          if (state.eoAudioURL) {
            try { URL.revokeObjectURL(state.eoAudioURL); } catch (e) {}
            state.eoAudioURL = '';
          }
          state.eoAudioChunks = [];
          const rec = new MediaRecorder(stream);
          state.eoMediaRecorder = rec;
          rec.ondataavailable = (ev) => {
            if (ev.data && ev.data.size > 0) state.eoAudioChunks.push(ev.data);
          };
          rec.onstop = () => {
            stream.getTracks().forEach((tr) => tr.stop());
            if (state.eoAudioChunks.length > 0) {
              const blob = new Blob(state.eoAudioChunks, { type: rec.mimeType || 'audio/webm' });
              state.eoAudioURL = URL.createObjectURL(blob);
            }
            state.eoVoiceRecording = false;
            renderOutputView();
          };
          rec.start();
          state.eoVoiceRecording = true;
          renderOutputView();
        } catch (err) {
          state.eoVoiceRecording = false;
          showSpeechWarn('Microphone access was denied or unavailable. Check browser permissions to record playback.');
        }
      }

      function bindEOEvents() {
        const task = EO_TASKS.find((t) => t.id === state.eoTaskId) || EO_TASKS[2];

            stopAudio();
            clearTimers();
            stopVoiceRecording();
            state.eoTaskId = first.id;
            state.eoTimerPhase = 'idle';
            renderOutputView();
          }
        }));
        els.mainContent.querySelectorAll('[data-eo-task]').forEach((b) => (b.onclick = () => {
          stopAudio();

          state.eoTaskId = b.dataset.eoTask;
          state.eoTimerPhase = 'idle';
          renderOutputView();
        }));

        if (btnCopyEO) {
          btnCopyEO.onclick = () => {
            const spoken = (tb ? tb.value : '').trim() || '[No transcript recorded yet]';
            const packet =
              `You are an official TCF Canada Expression Orale examiner. Evaluate my spoken transcript strictly against TCF Canada CLB 7 (B2, minimum 10/20) criteria.\n\n` +
              `TASK: ${task.taskNum} — ${task.title}\n` +
              `PROMPT:\n${task.prompt}\n\n` +
              `MY SPOKEN TRANSCRIPT / OUTLINE:\n${spoken}\n\n` +
              `Please give me:\n1. Estimated TCF EO score (/20) and CLB level.\n2. Natural French phrasing & grammar fixes.\n3. Two high-scoring B2 connectors or arguments I should add to pass CLB 7 comfortably.`;
            copyToClipboard(packet, btnCopyEO);
          };
        }

        els.mainContent.querySelectorAll('.speak-btn').forEach((b) => (b.onclick = () => speakPhrase(b.dataset.speak)));
        els.mainContent.querySelectorAll('[data-open-topic-quiz]').forEach((b) => (b.onclick = () => openTopicQuiz(b.dataset.openTopicQuiz)));
        const fullBtn = els.mainContent.querySelector(`[data-passage-play="eo_model_${task.id}"]`);
        if (fullBtn) fullBtn.onclick = () => playSequence(`eo_model_${task.id}`, task.modelSentences);
        els.mainContent.querySelectorAll(`[data-passage-id="eo_model_${task.id}"][data-sentence-row]`).forEach((row) => {
          row.onclick = () => {
            const idx = parseInt(row.dataset.sentenceRow, 10);
            stopAudio();
            state.activePassageId = `eo_model_${task.id}`;
            state.activeSentenceIdx = idx;
            const tok = ++state.playbackToken;
            state.isSpeaking = true;
            updateAudioUI();
            speakRaw(task.modelSentences[idx], {
              tok,
              onEnd: () => { if (tok === state.playbackToken) { state.isSpeaking = false; state.activeSpeakerLabel = ''; state.activePassageId = null; state.activeSentenceIdx = null; updateAudioUI(); } },
              onError: () => { if (tok === state.playbackToken) { state.isSpeaking = false; state.activeSpeakerLabel = ''; state.activePassageId = null; state.activeSentenceIdx = null; updateAudioUI(); } }
            });
          };
        });
        updateAudioUI();
      }

            a.href = url;
            a.download = `tcf-canada-french-progress-${todayISO()}.json`;
            document.body.appendChild(a);
            a.click();

          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(String(reader.result || '{}'));
              if (typeof data !== 'object' || data === null) throw new Error('Invalid');
              if (Array.isArray(data.completedChapters)) state.completedChapters = data.completedChapters;
              if (Array.isArray(data.completedGrammar)) state.completedGrammar = data.completedGrammar;
              if (Array.isArray(data.completedVocabLessons)) state.completedVocabLessons = data.completedVocabLessons;
              if (Array.isArray(data.mistakes)) state.mistakes = data.mistakes;
              if (data.weeklyPlan && typeof data.weeklyPlan === 'object') state.weeklyPlan = data.weeklyPlan;
              if (Array.isArray(data.customErrors)) state.customErrors = data.customErrors;
              if (Array.isArray(data.studyDays)) state.studyDays = data.studyDays;

              if (data.grammarQuizAnswers && typeof data.grammarQuizAnswers === 'object') state.grammarQuizAnswers = data.grammarQuizAnswers;
              if (data.vocabLessonQuizAnswers && typeof data.vocabLessonQuizAnswers === 'object') state.vocabLessonQuizAnswers = data.vocabLessonQuizAnswers;

        loadVoices();
        if (state.speechSupported && typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
      }

      
      // Standalone Light/Dark theme switcher
      (function setupTheme() {
        const key = "tcf_studio_theme_v1";
        const btn = document.getElementById("btnToggleTheme");
        const apply = (dark) => {
          document.documentElement.classList.toggle("dark", dark);
          if (btn) btn.textContent = dark ? "☀️" : "🌙";
        };
        const saved = localStorage.getItem(key);
        const initialDark = saved ? saved === "dark" : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        apply(initialDark);
        if (btn) {
          btn.onclick = () => {
            const next = !document.documentElement.classList.contains("dark");
            localStorage.setItem(key, next ? "dark" : "light");
            apply(next);
          };
        }
      })();

      init();
    })();
  </script>
</body>
</html>
