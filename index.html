                        <button type="button" data-speak="${escAttr(slide.frFull)}" class="speak-btn px-2.5 py-1 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs font-semibold cursor-pointer">🔊 ${esc(slide.frFull)}</button>
                      </div>
                      <div class="text-xs text-[var(--foreground)]">${esc(slide.exp)}</div>
                      ${state.showZh && slide.expZh ? `<div class="text-xs text-[var(--primary)]">${esc(slide.expZh)}</div>` : ''}
                    </div>
                  ` : ''}
                </div>
              `;
            } else if (slide.type === 'dict') {
              slideBodyHTML = `
                <div class="space-y-4">
                  <div class="p-4 rounded-xl bg-[var(--content)] border border-[var(--border)] space-y-3">
                    <div class="text-xs font-bold uppercase tracking-wider text-[var(--primary)]">Listen carefully and type the French sentence you hear</div>
                    <div class="flex flex-wrap items-center gap-2">
                      <button type="button" id="btnSlideDictPlay" class="px-4 py-2.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold cursor-pointer">
                        🔊 Play Sentence
                      </button>
                      <button type="button" id="btnSlideDictSlow" class="px-3.5 py-2.5 rounded-xl bg-[var(--card)] border border-[var(--border)] text-xs font-semibold text-[var(--foreground)] tint-muted-hover cursor-pointer">
                        🐢 Slow (0.72x)
                      </button>
                      ${slide.hint ? `
                        <button type="button" id="btnSlideDictHint" class="px-3 py-2 text-xs font-semibold text-[var(--link)] hover:underline cursor-pointer">
                          ${st.showHint ? 'Hide Hint' : '💡 Show Hint'}
                        </button>
                      ` : ''}
                    </div>
                    ${slide.hint && st.showHint ? `<div class="text-xs text-[var(--muted-foreground)]">${esc(slide.hint)}</div>` : ''}
                  </div>

                  <form id="slideDictForm" class="space-y-2.5">
                    <div class="flex flex-wrap items-center gap-1">
                      <span class="text-xs text-[var(--muted-foreground)] mr-1">Accents:</span>
                      ${['é', 'è', 'ê', 'à', 'ç', 'ô', 'û', 'î', 'ù', '’'].map((ch) => `<button type="button" data-slide-dict-accent="${escAttr(ch)}" class="px-2 py-1 rounded-md bg-[var(--content)] border border-[var(--border)] text-xs font-semibold tint-muted-hover cursor-pointer">${ch}</button>`).join('')}
                    </div>
                    <div class="flex flex-wrap sm:flex-nowrap gap-2">
                      <input
                        id="slideDictInput"
                        type="text"
                        autocomplete="off"
                        value="${escAttr(st.userVal || '')}"
                        placeholder="Type the French sentence you hear..."
                        ${st.answered ? 'disabled' : ''}
                        class="flex-1 px-4 py-3 rounded-xl bg-[var(--content)] border border-[var(--border)] text-sm text-[var(--foreground)] focus:outline-none focus:ring-2 focus:ring-[var(--primary)]"
                      />
                      <button type="submit" ${st.answered ? 'disabled' : ''} class="px-5 py-3 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold disabled:opacity-45 cursor-pointer shrink-0">
                        Check Dictation
                      </button>
                    </div>
                  </form>

                  ${st.answered ? `
                    <div class="p-4 rounded-xl border space-y-2 ${st.ok ? 'tint-success border-success-soft' : 'tint-warning border-warning-soft'}">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <span class="text-xs font-bold">${st.ok ? (st.closeAccent ? 'Correct — watch accents! ✓ (+8 XP)' : 'Exact Dictation ! ✓ (+8 XP)') : 'Compare with the exact French:'}</span>
                        <button type="button" data-speak="${escAttr(slide.frFull || slide.audio)}" class="speak-btn px-2.5 py-1 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs font-semibold cursor-pointer">🔊 Replay</button>
                      </div>
                      <div class="p-2.5 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs sm:text-sm font-semibold">
                        ${renderDictationDiff(st.userVal || '', slide.frFull || slide.audio)}
                      </div>
                      ${slide.en ? `<div class="text-xs text-[var(--muted-foreground)]">${esc(slide.en)}${state.showZh && slide.zh ? ` · ${esc(slide.zh)}` : ''}</div>` : ''}
                      ${slide.exp ? `<div class="text-xs text-[var(--foreground)]">${esc(slide.exp)}</div>` : ''}
                      ${state.showZh && slide.expZh ? `<div class="text-xs text-[var(--primary)]">${esc(slide.expZh)}</div>` : ''}
                    </div>
                  ` : ''}
                </div>
              `;
            } else if (slide.type === 'spot' || slide.type === 'mcq') {
              slideBodyHTML = `
                <div class="space-y-4">
                  ${slide.wrongSentence ? `
                    <div class="p-3.5 rounded-xl tint-error border border-error-soft text-xs sm:text-sm">
                      <span class="font-bold text-[var(--error)]">❌ Common Mistake:</span>
                      <span class="line-through ml-1 text-[var(--foreground)]">« ${esc(slide.wrongSentence)} »</span>
                    </div>
                  ` : ''}
                  <div class="p-4 rounded-xl bg-[var(--content)] border border-[var(--border)]">
                    <div class="text-base font-bold text-[var(--foreground)]">${esc(slide.prompt)}</div>
                  </div>
                  <div class="grid grid-cols-1 gap-2.5">
                    ${getShuffledOrder(`tls_${activeTopic.id}_${step}`, slide.opts.length).map((oi) => {
                      const opt = slide.opts[oi];
                      let cls = 'bg-[var(--content)] border-[var(--border)] text-[var(--foreground)] tint-muted-hover';
                      if (st.answered) {
                        if (oi === slide.ans) cls = 'tint-success border-success-soft text-[var(--success)] font-bold';
                        else if (oi === st.chosenOpt) cls = 'tint-error border-error-soft text-[var(--error)]';
                        else cls = 'bg-[var(--content)] border-[var(--border)] text-[var(--muted-foreground)] opacity-60';
                      }
                      return `<button type="button" data-slide-opt="${oi}" class="text-left px-4 py-3 rounded-xl border text-sm transition cursor-pointer ${cls}">${esc(opt)}</button>`;
                    }).join('')}
                  </div>
                  ${st.answered ? `
                    <div class="p-4 rounded-xl border space-y-2 ${st.ok ? 'tint-success border-success-soft' : 'tint-warning border-warning-soft'}">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <span class="text-xs font-bold">${st.ok ? 'Exact ! ✓ (+5 XP)' : `Correct: ${esc(slide.opts[slide.ans])}`}</span>
                        <button type="button" data-speak="${escAttr(slide.frFull)}" class="speak-btn px-2.5 py-1 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs font-semibold cursor-pointer">🔊 ${esc(slide.frFull)}</button>
                      </div>
                      <div class="text-xs text-[var(--foreground)]">${esc(slide.exp)}</div>
                      ${state.showZh && slide.expZh ? `<div class="text-xs text-[var(--primary)]">${esc(slide.expZh)}</div>` : ''}
                    </div>
                  ` : ''}
                </div>
              `;
            } else if (slide.type === 'build') {
              const placed = Array.isArray(st.builtIndices) ? st.builtIndices : [];
              const shuffledOrder = getShuffledOrder(`tlb_${activeTopic.id}_${step}`, slide.tiles.length);
              slideBodyHTML = `
                <div class="space-y-4">
                  <div class="p-4 rounded-xl bg-[var(--content)] border border-[var(--border)] space-y-1">
                    <div class="text-sm sm:text-base font-bold text-[var(--foreground)]">${esc(slide.prompt)}</div>
                    ${state.showZh && slide.promptZh ? `<div class="text-xs text-[var(--primary)]">${esc(slide.promptZh)}</div>` : ''}
                  </div>

                  <div class="space-y-1.5">
                    <div class="text-[11px] font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Your Sentence (Tap a tile to remove it)</div>
                    <div class="min-h-[54px] p-3 rounded-xl bg-[var(--content)] border border-dashed border-primary-soft flex flex-wrap gap-2 items-center">
                      ${placed.length === 0
                        ? '<span class="text-xs text-[var(--muted-foreground)]">Tap French word tiles below in order...</span>'
                        : placed.map((origIdx, pos) => `
                          <button type="button" data-build-remove="${pos}" ${st.answered ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg tint-primary border border-primary-soft text-[var(--primary)] text-sm font-semibold cursor-pointer disabled:cursor-default">
                            ${esc(slide.tiles[origIdx])}
                          </button>
                        `).join('')}
                    </div>
                  </div>

                  <div class="flex flex-wrap gap-2">
                    ${shuffledOrder.map((origIdx) => {
                      const used = placed.includes(origIdx);
                      return `
                        <button type="button" data-build-pick="${origIdx}" ${used || st.answered ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg border text-sm font-semibold transition cursor-pointer ${
                          used
                            ? 'bg-[var(--content)] border-[var(--border)] text-[var(--muted-foreground)] opacity-35 cursor-not-allowed'
                            : 'bg-[var(--card)] border-[var(--border)] text-[var(--foreground)] tint-muted-hover'
                        }">${esc(slide.tiles[origIdx])}</button>
                      `;
                    }).join('')}
                  </div>

                  ${!st.answered ? `
                    <div class="flex items-center gap-2">
                      <button type="button" id="btnBuildReset" class="px-3.5 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-semibold text-[var(--foreground)] tint-muted-hover cursor-pointer">↺ Reset</button>
                      <button type="button" id="btnBuildCheck" ${placed.length === 0 ? 'disabled' : ''} class="px-4 py-2 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold disabled:opacity-45 cursor-pointer">Check Sentence</button>
                    </div>
                  ` : `
                    <div class="p-4 rounded-xl border space-y-2 ${st.ok ? 'tint-success border-success-soft' : 'tint-warning border-warning-soft'}">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <span class="text-xs font-bold">${st.ok ? 'Exact ! ✓ (+8 XP)' : `Correct order: « ${esc(slide.answer)} »`}</span>
                        <button type="button" data-speak="${escAttr(slide.frFull)}" class="speak-btn px-2.5 py-1 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs font-semibold cursor-pointer">🔊 ${esc(slide.frFull)}</button>
                      </div>
                      <div class="text-xs text-[var(--foreground)]">${esc(slide.exp)}</div>
                      ${state.showZh && slide.expZh ? `<div class="text-xs text-[var(--primary)]">${esc(slide.expZh)}</div>` : ''}
                    </div>
                  `}
                </div>
              `;
            }

            return `
              <div class="space-y-4">
                ${topStepNav}

                <!-- Compact Page Stepper Strip -->
                <div class="studio-card p-3.5 space-y-2.5">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex flex-wrap items-center gap-1.5">
                      ${slides.map((sl, si) => {
                        const sSt = getLessonSlideState(`${activeTopic.id}_${si}`);
                        const done = sl.type === 'teach' ? (sSt.visited || step > si) : sSt.answered;
                        const active = si === step;
                        return `
                          <button type="button" data-lesson-step="${si}" class="px-2.5 py-1 rounded-lg text-xs font-semibold border transition cursor-pointer tabular-nums ${
                            active
                              ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent'
                              : done
                                ? 'tint-success border-success-soft text-[var(--success)]'
                                : 'bg-[var(--content)] border-[var(--border)] text-[var(--muted-foreground)] tint-muted-hover'
                          }">
                            ${typeIcon(sl.type)} ${si + 1}${done && !active ? ' ✓' : ''}
                          </button>
                        `;
                      }).join('')}
                    </div>
                    <span class="text-xs font-bold text-[var(--muted-foreground)] tabular-nums">Page ${step + 1} / ${slides.length}</span>
                  </div>
                  <div class="w-full h-1.5 rounded-full tint-muted overflow-hidden">
                    <div class="h-full rounded-full bg-[var(--primary)] transition-all duration-300" style="width:${pct}%"></div>
                  </div>
                </div>

                <!-- Single Focused Page Card -->
                <section class="studio-card p-5 sm:p-6 space-y-4">
                  <div class="border-b border-[var(--border)] pb-3">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <span class="px-2.5 py-0.5 rounded-full tint-primary text-[var(--primary)] text-[11px] font-bold">${esc(slide.stepTag)}</span>
                      <span class="text-xs text-[var(--muted-foreground)]">${activeTopic.icon} ${esc(activeTopic.title)}</span>
                    </div>
                    <h3 class="text-lg sm:text-xl font-bold text-[var(--foreground)] mt-2">${esc(slide.title)}</h3>
                  </div>

                  ${slideBodyHTML}

                  <div class="pt-4 border-t border-[var(--border)] flex flex-wrap items-center justify-between gap-2">
                    <button type="button" id="btnPrevLessonSlide" ${step === 0 ? 'disabled' : ''} class="px-3.5 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-semibold text-[var(--foreground)] tint-muted-hover disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
                      ← Previous Page
                    </button>
                    ${step + 1 < slides.length ? `
                      <button type="button" id="btnNextLessonSlide" class="px-4 py-2 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold cursor-pointer">
                        Next Page (${step + 2}/${slides.length}) →
                      </button>
                    ` : `
                      <button type="button" id="btnStartQuizFromLearn" class="px-4 py-2.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold cursor-pointer">
                        Start ${total}-Question Mastery Quiz →
                      </button>
                    `}
                  </div>
                </section>
              </div>
            `;
          }

          // 2. Step 2: Finished Summary Screen
          if (state.topicQuizFinished) {
            const subTotal = activeIndices.length;
            const score = activeIndices.filter((ri) => state.topicQuizAnswers[ri] && state.topicQuizAnswers[ri].ok).length;
            const missedIndices = activeIndices.filter((ri) => !(state.topicQuizAnswers[ri] && state.topicQuizAnswers[ri].ok));
            const pct = subTotal ? Math.round((score / subTotal) * 100) : 0;
            const mastered = !state.topicQuizRetrySubset && score >= 7;
            const curIdx = GRAMMAR_QUIZZES.findIndex((t) => t.id === activeTopic.id);
            const nextTopic = GRAMMAR_QUIZZES[curIdx + 1] || null;

            return `
              <div class="space-y-4">
                ${topStepNav}

                <section class="studio-card p-5 sm:p-6 space-y-5">
                  <div class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-[var(--border)]">
                    <div>
                      <div class="text-xs font-bold uppercase tracking-wider text-[var(--primary)]">${activeTopic.icon} ${esc(activeTopic.title)}${state.topicQuizRetrySubset ? ' · Missed-Only Drill' : ''}</div>
                      <h3 class="text-xl font-bold text-[var(--foreground)] mt-1">
                        ${mastered ? '🎉 Topic Mastered!' : missedIndices.length === 0 ? '🎉 All Missed Items Cleared!' : score >= Math.ceil(subTotal * 0.6) ? '👍 Good Progress — Practice Your Misses' : '💡 Review Guided Course & Retry'}
                      </h3>
                      <p class="text-xs text-[var(--muted-foreground)] mt-0.5">Score ≥ 7/${total} on the full quiz to earn the Mastery badge.</p>
                    </div>
                    <div class="text-right">
                      <div class="text-3xl font-bold tabular-nums ${missedIndices.length === 0 || mastered ? 'text-[var(--success)]' : 'text-[var(--primary)]'}">${score} / ${subTotal}</div>
                      <div class="text-xs font-semibold text-[var(--muted-foreground)] tabular-nums">${pct}%</div>
                    </div>
                  </div>

                  <div class="space-y-2.5">
                    ${activeIndices.map((ri) => {
                      const q = qs[ri];
                      const ansObj = state.topicQuizAnswers[ri] || {};
                      const ok = Boolean(ansObj.ok);
                      const yourDisplay = ansObj.userText != null
                        ? ansObj.userText
                        : (typeof ansObj.chosenOpt === 'number' ? q.opts[ansObj.chosenOpt] : '—');
                      return `
                        <div class="p-3.5 rounded-xl border space-y-1.5 ${ok ? 'tint-success border-success-soft' : 'tint-error border-error-soft'}">
                          <div class="flex flex-wrap items-start justify-between gap-2">
                            <div class="text-xs font-semibold text-[var(--foreground)]">
                              <span class="font-bold mr-1">${ok ? '✓' : '✕'} Q${ri + 1}.</span>${esc(q.q)}
                            </div>
                            ${q.frFull ? `<button type="button" data-speak="${escAttr(q.frFull)}" class="speak-btn px-2 py-0.5 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs font-semibold cursor-pointer shrink-0">🔊 Hear</button>` : ''}
                          </div>
                          <div class="text-xs">
                            ${!ok ? `<span class="text-[var(--error)] mr-2">Your answer: <strong>${esc(yourDisplay)}</strong></span>` : ''}
                            <span class="text-[var(--success)]">Correct: <strong>${esc(q.opts[q.ans])}</strong></span>
                            ${q.frFull ? `<span class="text-[var(--muted-foreground)] ml-2">« ${esc(q.frFull)} »</span>` : ''}
                          </div>
                          <div class="text-xs text-[var(--foreground)]">${esc(q.exp)}</div>
                          ${state.showZh && q.expZh ? `<div class="text-xs text-[var(--primary)]">${esc(q.expZh)}</div>` : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>

                  <div class="pt-3 border-t border-[var(--border)] flex flex-wrap items-center justify-between gap-2">
                    <div class="flex flex-wrap items-center gap-2">
                      ${missedIndices.length > 0 ? `
                        <button type="button" id="btnRetryMissedOnly" class="px-3.5 py-2 rounded-xl tint-warning border border-warning-soft text-[var(--warning)] text-xs font-bold cursor-pointer">
                          🔁 Practice Only Missed (${missedIndices.length} Q)
                        </button>
                      ` : ''}
                      <button type="button" data-tq-phase="learn" class="px-3.5 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-semibold text-[var(--foreground)] tint-muted-hover cursor-pointer">
                        📘 Review Guided Course
                      </button>
                      <button type="button" id="btnRetryTopicQuiz" class="px-3.5 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-semibold text-[var(--foreground)] tint-muted-hover cursor-pointer">
                        🔄 Full Quiz Again
                      </button>
                    </div>
                    <div class="flex items-center gap-2">
                      ${nextTopic ? `<button type="button" data-learn-topic="${nextTopic.id}" class="px-4 py-2 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold cursor-pointer">Next Topic: ${esc(nextTopic.title)} →</button>` : ''}
                    </div>
                  </div>
                </section>
              </div>
            `;
          }

          // 3. Step 2: Active Question Runner Screen (MCQ or FIB)
          const pos = Math.min(state.topicQuizIdx, Math.max(0, activeIndices.length - 1));
          const realIdx = activeIndices[pos];
          const q = qs[realIdx];
          const ansObj = state.topicQuizAnswers[realIdx];
          const isAnswered = Boolean(ansObj && typeof ansObj.ok === 'boolean');
          const ok = isAnswered && ansObj.ok;
          const pct = activeIndices.length ? Math.round(((pos + (isAnswered ? 1 : 0)) / activeIndices.length) * 100) : 0;
          const isFib = state.topicQuizInputMode === 'fib';

          return `
            <div class="space-y-4">
              ${topStepNav}

              <section class="studio-card p-5 sm:p-6 space-y-5">
                <div class="space-y-2.5">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                      <span class="px-2 py-0.5 rounded border text-[11px] font-bold ${levelBadgeStyle(activeTopic.level)}">${esc(activeTopic.badge)}</span>
                      <span class="text-xs font-bold text-[var(--primary)]">${activeTopic.icon} ${esc(activeTopic.title)}</span>
                      ${state.topicQuizRetrySubset ? `<span class="px-2 py-0.5 rounded-full tint-warning text-[var(--warning)] text-[11px] font-bold">Missed Drill</span>` : ''}
                    </div>
                    <div class="flex items-center gap-2">
                      <div class="inline-flex p-0.5 rounded-xl bg-[var(--content)] border border-[var(--border)]">
                        <button type="button" data-tq-input-mode="mcq" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold cursor-pointer ${!isFib ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'}">Choices</button>
                        <button type="button" data-tq-input-mode="fib" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold cursor-pointer ${isFib ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'}">⌨️ Type Answer</button>
                      </div>
                      <span class="text-xs font-bold text-[var(--muted-foreground)] tabular-nums">${pos + 1} / ${activeIndices.length}</span>
                    </div>
                  </div>
                  <div class="w-full h-1.5 rounded-full tint-muted overflow-hidden">
                    <div class="h-full rounded-full bg-[var(--primary)] transition-all duration-300" style="width:${pct}%"></div>
                  </div>
                </div>

                <div class="p-4 rounded-xl bg-[var(--content)] border border-[var(--border)]">
                  <div class="text-base sm:text-lg font-bold text-[var(--foreground)] leading-snug">${esc(q.q)}</div>
                </div>

                ${isFib ? `
                  <form id="tqFibForm" class="space-y-2.5">
                    <div class="flex flex-wrap items-center gap-1">
                      <span class="text-xs text-[var(--muted-foreground)] mr-1">Accents:</span>
                      ${['é', 'è', 'ê', 'à', 'ç', 'ô', 'û', 'î', 'ù', '’'].map((ch) => `<button type="button" data-tq-accent="${escAttr(ch)}" class="px-2 py-1 rounded-md bg-[var(--content)] border border-[var(--border)] text-xs font-semibold tint-muted-hover cursor-pointer">${ch}</button>`).join('')}
                    </div>
                    <div class="flex flex-wrap sm:flex-nowrap gap-2">
                      <input
                        id="tqFibInput"
                        type="text"
                        autocomplete="off"
                        value="${escAttr(isAnswered ? (ansObj.userText || '') : (state.topicQuizTypedVal || ''))}"
                        placeholder="Type the missing French answer..."
                        ${isAnswered ? 'disabled' : ''}
                        class="flex-1 px-4 py-3 rounded-xl bg-[var(--content)] border border-[var(--border)] text-sm text-[var(--foreground)] focus:outline-none focus:ring-2 focus:ring-[var(--primary)]"
                      />
                      <button type="submit" ${isAnswered ? 'disabled' : ''} class="px-5 py-3 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold disabled:opacity-45 cursor-pointer shrink-0">
                        Check Answer
                      </button>
                    </div>
                  </form>
                ` : `
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    ${getShuffledOrder(`tq_${activeTopic.id}_${realIdx}`, q.opts.length).map((oi) => {
                      const opt = q.opts[oi];
                      let cls = 'bg-[var(--content)] border-[var(--border)] text-[var(--foreground)] tint-muted-hover';
                      if (isAnswered) {
                        if (oi === q.ans) cls = 'tint-success border-success-soft text-[var(--success)] font-bold';
                        else if (oi === ansObj.chosenOpt) cls = 'tint-error border-error-soft text-[var(--error)]';
                        else cls = 'bg-[var(--content)] border-[var(--border)] text-[var(--muted-foreground)] opacity-60';
                      }
                      return `<button type="button" data-tq-opt="${oi}" class="text-left px-4 py-3 rounded-xl border text-sm transition cursor-pointer ${cls}">${esc(opt)}</button>`;
                    }).join('')}
                  </div>
                `}

                ${isAnswered ? `
                  <div class="p-4 rounded-xl border space-y-2 ${ok ? 'tint-success border-success-soft' : 'tint-warning border-warning-soft'}">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <span class="text-xs font-bold">${ok ? (ansObj.closeAccent ? 'Correct — watch accents! ✓ (+5 XP)' : 'Exact ! ✓ (+5 XP)') : `Answer: ${esc(q.opts[q.ans])}`}</span>
                      ${q.frFull ? `<button type="button" data-speak="${escAttr(q.frFull)}" class="speak-btn px-2.5 py-1 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs font-semibold cursor-pointer">🔊 ${esc(q.frFull)}</button>` : ''}
                    </div>
                    <div class="text-xs text-[var(--foreground)]">${esc(q.exp)}</div>
                    ${state.showZh && q.expZh ? `<div class="text-xs text-[var(--primary)]">${esc(q.expZh)}</div>` : ''}
                    <div class="pt-1 flex justify-end">
                      <button type="button" id="btnNextTopicQ" class="px-4 py-2 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold cursor-pointer">
                        ${pos + 1 < activeIndices.length ? 'Next Question →' : 'See Results →'}
                      </button>
                    </div>
                  </div>
                ` : ''}
              </section>
            </div>
          `;
        }

        // 4. Topic Catalog Screen
        const cats = [
          { id: 'all', label: `All Topics (${GRAMMAR_QUIZZES.length})` },
          { id: 'pronouns', label: '👤 Pronouns' },
          { id: 'tenses', label: '⏱️ Tenses' },
          { id: 'foundations', label: '🏷️ Foundations' },
          { id: 'advanced', label: '✨ B1–B2 Mastery' }
        ];

        const filtered = GRAMMAR_QUIZZES.filter((t) => {
          const catOk = state.topicQuizCategory === 'all' || t.category === state.topicQuizCategory;
          const lvlOk = state.drillLevel === 'all' || t.level === state.drillLevel;
          return catOk && lvlOk;
        });

        const masteredCount = GRAMMAR_QUIZZES.filter((t) => {
          const rec = state.topicQuizBest[t.id];
          return rec && rec.best >= 7;
        }).length;

        return `
          <div class="space-y-4">
            <div class="studio-card p-4 flex flex-wrap items-center justify-between gap-3">
              <div class="flex flex-wrap gap-1.5">
                ${cats.map((c) => `
                  <button type="button" data-tq-cat="${c.id}" class="px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer border ${
                    state.topicQuizCategory === c.id
                      ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent'
                      : 'bg-[var(--content)] border-[var(--border)] text-[var(--foreground)] tint-muted-hover'
                  }">${c.label}</button>
                `).join('')}
              </div>
              <div class="text-xs font-semibold text-[var(--muted-foreground)] tabular-nums">
                Mastered (≥ 7/8): <strong class="text-[var(--success)]">${masteredCount} / ${GRAMMAR_QUIZZES.length}</strong>
              </div>
            </div>

            ${filtered.length === 0 ? `
              <div class="studio-card p-8 text-center text-sm text-[var(--muted-foreground)]">
                No grammar quizzes match this level &amp; category filter. Switch level to “All Levels” above.
              </div>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                ${filtered.map((t) => {
                  const rec = state.topicQuizBest[t.id];
                  const best = rec ? rec.best : null;
                  const total = (t.questions || []).length;
                  const mastered = best !== null && best >= 7;
                  const slides = GRAMMAR_LESSONS[t.id] || [];
                  const donePages = slides.filter((sl, si) => {
                    const sSt = state.topicLessonState[`${t.id}_${si}`];
                    return sSt && (sl.type === 'teach' ? sSt.visited : sSt.answered);
                  }).length;
                  const studyFirstPrimary = best === null && donePages < slides.length;

                  return `
                    <div class="studio-card p-4 flex flex-col justify-between gap-3">
                      <div class="space-y-1.5">
                        <div class="flex items-center justify-between gap-2">
                          <div class="flex items-center gap-2 min-w-0">
                            <span class="text-lg shrink-0">${t.icon}</span>
                            <span class="px-2 py-0.5 rounded border text-[11px] font-bold shrink-0 ${levelBadgeStyle(t.level)}">${esc(t.badge)}</span>
                          </div>
                          <span class="px-2 py-0.5 rounded-full text-[11px] font-bold tabular-nums ${
                            mastered ? 'tint-success text-[var(--success)]' : best !== null ? 'tint-primary text-[var(--primary)]' : 'tint-muted text-[var(--muted-foreground)]'
                          }">
                            ${mastered ? `✓ ${best}/${total}` : best !== null ? `Best ${best}/${total}` : `${total} Qs`}
                          </span>
                        </div>
                        <h3 class="text-sm font-bold text-[var(--foreground)]">${esc(t.title)}</h3>
                        <p class="text-xs text-[var(--muted-foreground)] leading-snug">${esc(t.subtitle)}</p>
                        <div class="text-[11px] text-[var(--muted-foreground)] tabular-nums">
                          📘 ${slides.length} interactive pages (Teach + FIB + Spot + Build)${donePages > 0 ? ` · ${donePages}/${slides.length} done` : ''}
                        </div>
                      </div>
                      <div class="pt-2 border-t border-[var(--border)] flex flex-wrap items-center justify-between gap-2">
                        <button type="button" data-learn-in-course="${t.id}" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[var(--content)] border border-[var(--border)] text-[var(--foreground)] tint-muted-hover cursor-pointer">
                          📘 Lesson in Course
                        </button>
                        <button type="button" data-start-topic="${t.id}" class="px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer bg-[var(--primary)] text-[var(--primary-foreground)]">
                          ${best !== null ? 'Retake Quiz →' : `Start Quiz (${total} Q) →`}
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;
      }

      function bindTopicQuizEvents() {
        els.mainContent.querySelectorAll('[data-tq-cat]').forEach((b) => {
          b.onclick = () => {
            state.topicQuizCategory = b.dataset.tqCat;
            rerenderActiveTopicView();
          };
        });
        els.mainContent.querySelectorAll('[data-learn-in-course]').forEach((b) => {
          b.onclick = () => openTopicQuiz(b.dataset.learnInCourse, 'learn', 'course');
        });
        els.mainContent.querySelectorAll('[data-learn-topic]').forEach((b) => {
          b.onclick = () => {
            stopAudio();
            state.activeTopicQuizId = b.dataset.learnTopic;
            state.topicQuizPhase = 'learn';
            state.topicLessonStep = 0;
            state.topicQuizIdx = 0;
            state.topicQuizAnswers = {};
            state.topicQuizFinished = false;
            state.topicQuizRetrySubset = null;
            state.topicQuizTypedVal = '';
            rerenderActiveTopicView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        });
        els.mainContent.querySelectorAll('[data-start-topic]').forEach((b) => {
          b.onclick = () => {
            stopAudio();
            state.activeTopicQuizId = b.dataset.startTopic;
            state.topicQuizPhase = 'quiz';
            state.topicQuizIdx = 0;
            state.topicQuizAnswers = {};
            state.topicQuizFinished = false;
            state.topicQuizRetrySubset = null;
            state.topicQuizTypedVal = '';
            rerenderActiveTopicView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        });
        els.mainContent.querySelectorAll('[data-tq-phase]').forEach((b) => {
          b.onclick = () => {
            stopAudio();
            state.topicQuizPhase = b.dataset.tqPhase === 'quiz' ? 'quiz' : 'learn';
            rerenderActiveTopicView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        });
        els.mainContent.querySelectorAll('[data-tq-essentials]').forEach((b) => {
          b.onclick = () => {
            state.essentialsTab = b.dataset.tqEssentials;
            state.essentialsSearch = '';
            navigate('ws', 'essentials');
          };
        });
        const btnBack = document.getElementById('btnBackToTopics');
        if (btnBack) {
          btnBack.onclick = () => {
            stopAudio();
            state.activeTopicQuizId = null;
            state.topicQuizPhase = 'learn';
            state.topicQuizFinished = false;
            state.topicQuizRetrySubset = null;
            rerenderActiveTopicView();
          };
        }

        const activeTopic = state.activeTopicQuizId
          ? GRAMMAR_QUIZZES.find((t) => t.id === state.activeTopicQuizId) || null
          : null;

        if (!activeTopic) return;

        // Bindings for Step 1 Guided Course Slides
        const slides = GRAMMAR_LESSONS[activeTopic.id] || [];
        const step = Math.max(0, Math.min(state.topicLessonStep || 0, Math.max(0, slides.length - 1)));
        const slide = slides[step];
        const sKey = `${activeTopic.id}_${step}`;
        const st = getLessonSlideState(sKey);

        const markCurVisited = () => {
          if (slide && slide.type === 'teach') {
            st.visited = true;
            saveState();
          }
        };

        els.mainContent.querySelectorAll('[data-lesson-step]').forEach((b) => {
          b.onclick = () => {
            stopAudio();
            markCurVisited();
            state.topicLessonStep = parseInt(b.dataset.lessonStep, 10) || 0;
            rerenderActiveTopicView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        });

        const btnPrevSlide = document.getElementById('btnPrevLessonSlide');
        if (btnPrevSlide) {
          btnPrevSlide.onclick = () => {
            stopAudio();
            markCurVisited();
            if (step > 0) state.topicLessonStep = step - 1;
            rerenderActiveTopicView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        }

        const btnNextSlide = document.getElementById('btnNextLessonSlide');
        if (btnNextSlide) {
          btnNextSlide.onclick = () => {
            stopAudio();
            markCurVisited();
            if (step + 1 < slides.length) state.topicLessonStep = step + 1;
            rerenderActiveTopicView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        }

        const btnStartFromLearn = document.getElementById('btnStartQuizFromLearn');
        if (btnStartFromLearn) {
          btnStartFromLearn.onclick = () => {
            stopAudio();
            markCurVisited();
            state.topicQuizPhase = 'quiz';
            state.topicQuizFinished = false;
            state.topicQuizIdx = 0;
            state.topicQuizAnswers = {};
            state.topicQuizRetrySubset = null;
            state.topicQuizTypedVal = '';
            rerenderActiveTopicView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        }

        if (slide && slide.type === 'fib') {
          const btnHint = document.getElementById('btnSlideHint');
          if (btnHint) {
            btnHint.onclick = () => {
              st.showHint = !st.showHint;
              rerenderActiveTopicView();
            };
          }
          const fibForm = document.getElementById('slideFibForm');
          const fibInp = document.getElementById('slideFibInput');
          if (fibForm && fibInp) {
            if (!st.answered) fibInp.focus();
            fibInp.oninput = () => { st.userVal = fibInp.value; };
            els.mainContent.querySelectorAll('[data-slide-accent]').forEach((b) => {
              b.onclick = () => {
                const ins = b.dataset.slideAccent;
                const posStart = fibInp.selectionStart || fibInp.value.length;
                const posEnd = fibInp.selectionEnd || fibInp.value.length;
                fibInp.value = fibInp.value.slice(0, posStart) + ins + fibInp.value.slice(posEnd);
                fibInp.focus();
                fibInp.selectionStart = fibInp.selectionEnd = posStart + ins.length;
                st.userVal = fibInp.value;
              };
            });
            fibForm.onsubmit = (e) => {
              e.preventDefault();
              const val = fibInp.value.trim();
              if (!val || st.answered) return;
              st.userVal = val;
              const nVal = normalizeFr(val);
              const exactOk = (slide.answers || []).some((a) => normalizeFr(a) === nVal);
              const accentOk = exactOk || (slide.answers || []).some((a) => stripAccents(normalizeFr(a)) === stripAccents(nVal));
              st.answered = true;
              st.ok = accentOk;
              st.closeAccent = !exactOk && accentOk;
              if (accentOk) addXP(5);
              else saveState();
              if (slide.frFull) speakPhrase(slide.frFull);
              rerenderActiveTopicView();
            };
          }
        } else if (slide && slide.type === 'dict') {
          const bPlay = document.getElementById('btnSlideDictPlay');
          if (bPlay) bPlay.onclick = () => speakPhrase(slide.audio || slide.frFull);
          const bSlow = document.getElementById('btnSlideDictSlow');
          if (bSlow) bSlow.onclick = () => speakPhrase(slide.audio || slide.frFull, 0.72);
          const bHint = document.getElementById('btnSlideDictHint');
          if (bHint) bHint.onclick = () => { st.showHint = !st.showHint; rerenderActiveTopicView(); };
          const dForm = document.getElementById('slideDictForm');
          const dInp = document.getElementById('slideDictInput');
          if (dForm && dInp) {
            if (!st.answered) dInp.focus();
            dInp.oninput = () => { st.userVal = dInp.value; };
            els.mainContent.querySelectorAll('[data-slide-dict-accent]').forEach((b) => {
              b.onclick = () => {
                const ins = b.dataset.slideDictAccent;
                const posStart = dInp.selectionStart || dInp.value.length;
                const posEnd = dInp.selectionEnd || dInp.value.length;
                dInp.value = dInp.value.slice(0, posStart) + ins + dInp.value.slice(posEnd);
                dInp.focus();
                dInp.selectionStart = dInp.selectionEnd = posStart + ins.length;
                st.userVal = dInp.value;
              };
            });
            dForm.onsubmit = (e) => {
              e.preventDefault();
              const val = dInp.value.trim();
              if (!val || st.answered) return;
              st.userVal = val;
              const nVal = normalizeFr(val);
              const pool = (slide.answers && slide.answers.length) ? slide.answers : [slide.frFull || slide.audio];
              const exactOk = pool.some((a) => normalizeFr(a) === nVal);
              const accentOk = exactOk || pool.some((a) => stripAccents(normalizeFr(a)) === stripAccents(nVal));
              st.answered = true;
              st.ok = accentOk;
              st.closeAccent = !exactOk && accentOk;
              if (accentOk) addXP(8);
              else saveState();
              rerenderActiveTopicView();
            };
          }
        } else if (slide && (slide.type === 'spot' || slide.type === 'mcq')) {
          els.mainContent.querySelectorAll('[data-slide-opt]').forEach((b) => {
            b.onclick = () => {
              if (st.answered) return;
              const oi = parseInt(b.dataset.slideOpt, 10);
              st.answered = true;
              st.chosenOpt = oi;
              st.ok = oi === slide.ans;
              if (st.ok) addXP(5);
              else saveState();
              if (slide.frFull) speakPhrase(slide.frFull);
              rerenderActiveTopicView();
            };
          });
        } else if (slide && slide.type === 'build') {
          els.mainContent.querySelectorAll('[data-build-pick]').forEach((b) => {
            b.onclick = () => {
              if (st.answered) return;
              const origIdx = parseInt(b.dataset.buildPick, 10);
              if (!Array.isArray(st.builtIndices)) st.builtIndices = [];
              if (!st.builtIndices.includes(origIdx)) st.builtIndices.push(origIdx);
              rerenderActiveTopicView();
            };
          });
          els.mainContent.querySelectorAll('[data-build-remove]').forEach((b) => {
            b.onclick = () => {
              if (st.answered) return;
              const pos = parseInt(b.dataset.buildRemove, 10);
              if (Array.isArray(st.builtIndices)) st.builtIndices.splice(pos, 1);
              rerenderActiveTopicView();
            };
          });
          const btnBuildReset = document.getElementById('btnBuildReset');
          if (btnBuildReset) {
            btnBuildReset.onclick = () => {
              if (st.answered) return;
              st.builtIndices = [];
              rerenderActiveTopicView();
            };
          }
          const btnBuildCheck = document.getElementById('btnBuildCheck');
          if (btnBuildCheck) {
            btnBuildCheck.onclick = () => {
              if (st.answered || !Array.isArray(st.builtIndices) || st.builtIndices.length === 0) return;
              const built = st.builtIndices.map((idx) => slide.tiles[idx]).join(' ');
              const ok = normalizeFr(built) === normalizeFr(slide.answer);
              st.answered = true;
              st.ok = ok;
              if (ok) addXP(8);
              else saveState();
              if (slide.frFull) speakPhrase(slide.frFull);
              rerenderActiveTopicView();
            };
          }
        }

        // Bindings for Step 2 Mastery Quiz
        const qs = activeTopic.questions || [];
        const activeIndices = (Array.isArray(state.topicQuizRetrySubset) && state.topicQuizRetrySubset.length)
          ? state.topicQuizRetrySubset
          : qs.map((_, i) => i);

        els.mainContent.querySelectorAll('[data-tq-input-mode]').forEach((b) => {
          b.onclick = () => {
            state.topicQuizInputMode = b.dataset.tqInputMode === 'fib' ? 'fib' : 'mcq';
            rerenderActiveTopicView();
          };
        });

        const btnRetry = document.getElementById('btnRetryTopicQuiz');
        if (btnRetry) {
          btnRetry.onclick = () => {
            stopAudio();
            state.topicQuizPhase = 'quiz';
            state.topicQuizIdx = 0;
            state.topicQuizAnswers = {};
            state.topicQuizFinished = false;
            state.topicQuizRetrySubset = null;
            state.topicQuizTypedVal = '';
            rerenderActiveTopicView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        }

        const btnRetryMissed = document.getElementById('btnRetryMissedOnly');
        if (btnRetryMissed) {
          btnRetryMissed.onclick = () => {
            stopAudio();
            const missed = activeIndices.filter((ri) => !(state.topicQuizAnswers[ri] && state.topicQuizAnswers[ri].ok));
            state.topicQuizRetrySubset = missed.length ? missed : null;
            state.topicQuizIdx = 0;
            state.topicQuizAnswers = {};
            state.topicQuizFinished = false;
            state.topicQuizTypedVal = '';
            rerenderActiveTopicView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        }

        const pos = Math.min(state.topicQuizIdx, Math.max(0, activeIndices.length - 1));
        const realIdx = activeIndices[pos];
        const curQ = qs[realIdx];

        const recordQuizResult = (ok, chosenOpt, userText, closeAccent) => {
          state.topicQuizAnswers[realIdx] = { ok, chosenOpt, userText, closeAccent: Boolean(closeAccent) };
          if (ok) {
            addXP(5);
          } else if (curQ) {
            recordMistake({
              id: `tq_${activeTopic.id}_${realIdx}`,
              source: activeTopic.title,
              level: activeTopic.level,
              prompt: curQ.q,
              choices: curQ.opts,
              answer: curQ.opts[curQ.ans],
              exp: curQ.exp
            });
            renderSidebar();
          }
          if (curQ && curQ.frFull) speakPhrase(curQ.frFull);
          rerenderActiveTopicView();
        };

        els.mainContent.querySelectorAll('[data-tq-opt]').forEach((b) => {
          b.onclick = () => {
            if (!curQ || state.topicQuizAnswers[realIdx]) return;
            const opt = parseInt(b.dataset.tqOpt, 10);
            recordQuizResult(opt === curQ.ans, opt, null, false);
          };
        });

        const tqFibForm = document.getElementById('tqFibForm');
        const tqFibInp = document.getElementById('tqFibInput');
        if (tqFibForm && tqFibInp && curQ) {
          if (!state.topicQuizAnswers[realIdx]) tqFibInp.focus();
          tqFibInp.oninput = () => { state.topicQuizTypedVal = tqFibInp.value; };
          els.mainContent.querySelectorAll('[data-tq-accent]').forEach((b) => {
            b.onclick = () => {
              const ins = b.dataset.tqAccent;
              const s = tqFibInp.selectionStart || tqFibInp.value.length;
              const ePos = tqFibInp.selectionEnd || tqFibInp.value.length;
              tqFibInp.value = tqFibInp.value.slice(0, s) + ins + tqFibInp.value.slice(ePos);
              tqFibInp.focus();
              tqFibInp.selectionStart = tqFibInp.selectionEnd = s + ins.length;
              state.topicQuizTypedVal = tqFibInp.value;
            };
          });
          tqFibForm.onsubmit = (e) => {
            e.preventDefault();
            if (state.topicQuizAnswers[realIdx]) return;
            const val = tqFibInp.value.trim();
            if (!val) return;
            const expected = curQ.opts[curQ.ans];
            const nVal = normalizeFr(val);
            const nExp = normalizeFr(expected);
            const exactOk = nVal === nExp;
            const accentOk = exactOk || stripAccents(nVal) === stripAccents(nExp);
            recordQuizResult(accentOk, null, val, !exactOk && accentOk);
          };
        }

        const btnNextQ = document.getElementById('btnNextTopicQ');
        if (btnNextQ) {
          btnNextQ.onclick = () => {
            stopAudio();
            state.topicQuizTypedVal = '';
            if (pos + 1 < activeIndices.length) {
              state.topicQuizIdx = pos + 1;
            } else {
              if (!state.topicQuizRetrySubset) {
                const score = qs.filter((_, i) => state.topicQuizAnswers[i] && state.topicQuizAnswers[i].ok).length;
                const prev = state.topicQuizBest[activeTopic.id];
                const prevBest = prev ? prev.best : 0;
                state.topicQuizBest[activeTopic.id] = { best: Math.max(prevBest, score), total: qs.length };
                addXP(15);
                if (score >= 7 && prevBest < 7) addXP(20);
                saveState();
                renderSidebar();
              }
              state.topicQuizFinished = true;
            }
            rerenderActiveTopicView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        }
      }

      function renderCourseView() {
        if (state.activeTopicQuizId) {
          els.mainContent.innerHTML = renderTopicQuizzesHTML({ context: 'course' });
          els.mainContent.querySelectorAll('.speak-btn').forEach((b) => (b.onclick = () => speakPhrase(b.dataset.speak)));
          bindTopicQuizEvents();
          return;
        }

        const curLvl = ['A0', 'A1', 'A2', 'B1', 'B2'].includes(state.courseLevel) ? state.courseLevel : 'A1';
        state.courseLevel = curLvl;
        const rec = getRecommendedNextCourseTopic();
        const masteredCourses = GRAMMAR_QUIZZES.filter((t) => state.topicQuizBest[t.id] && state.topicQuizBest[t.id].best >= 7).length;

        const soundsList = GRAMMAR_SYLLABUS.filter((g) => g.level === 'Sounds');
        const levelCourses = GRAMMAR_QUIZZES.filter((t) => t.level === curLvl);
        const levelVocab = VOCAB_SYLLABUS.filter((v) => v.level === curLvl);
        const levelUnits = CHAPTERS.filter((c) => c.level === curLvl);
        const levelNotes = GRAMMAR_SYLLABUS.filter((g) => g.level === curLvl);

        const levelTabs = [
          { id: 'A0', label: `🔊 A0 Sounds (${soundsList.length})` },
          { id: 'A1', label: `A1 Foundations (${GRAMMAR_QUIZZES.filter((t) => t.level === 'A1').length})` },
          { id: 'A2', label: `A2 Elementary (${GRAMMAR_QUIZZES.filter((t) => t.level === 'A2').length})` },
          { id: 'B1', label: `B1 Intermediate (${GRAMMAR_QUIZZES.filter((t) => t.level === 'B1').length})` },
          { id: 'B2', label: `B2 CLB 7 (${GRAMMAR_QUIZZES.filter((t) => t.level === 'B2').length})` }
        ];

        const typeFilters = [
          { id: 'all', label: 'All' },
          { id: 'grammar', label: `📘 Guided Courses (${levelCourses.length})` },
          { id: 'units', label: `🎧 Listening & Reading Units (${levelUnits.length})` },

                ` : state.drillMode === 'gender' ? `
                  <div class="p-5 rounded-xl bg-[var(--content)] border border-[var(--border)] text-center space-y-2">
                    <div class="text-xs uppercase font-bold text-[var(--primary)]">Gender Rapid-Fire • Choose un (m.) or une (f.)</div>
                    <div class="text-2xl font-bold text-[var(--foreground)]">___ ${esc(item.word)}</div>
                    ${state.drillAnswered !== null ? `
                      <div class="pt-1 flex items-center justify-center gap-2 text-sm font-semibold text-[var(--primary)]">
                        <span>${esc(item.full)}</span>
                        <button type="button" data-speak="${escAttr(item.full)}" class="speak-btn px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-xs cursor-pointer">🔊</button>
                      </div>
                    ` : ''}
                  </div>
                ` : state.drillMode === 'fauxamis' ? `
                  <div class="p-4 rounded-xl bg-[var(--content)] border border-[var(--border)]">
                    <div class="text-xs uppercase font-bold text-[var(--error)]">False Friend Alert</div>
                    <div class="text-xl font-bold mt-1">${esc(item.word)}</div>
                    <div class="text-sm text-[var(--muted-foreground)] mt-1 flex items-center gap-2">
                      <span>« ${esc(item.context)} »</span>
                      <button type="button" data-speak="${escAttr(item.context)}" class="speak-btn px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-xs cursor-pointer">🔊</button>
                    </div>
                  </div>
                ` : `
                  <div class="p-4 rounded-xl bg-[var(--content)] border border-[var(--border)]">
                    <div class="text-lg font-bold text-[var(--foreground)]">${esc(item.prompt)}</div>
                    ${item.hint ? `<div class="text-xs text-[var(--muted-foreground)] mt-1">Hint: ${esc(item.hint)}</div>` : ''}
                  </div>
                `}

                <!-- Input Area: Typing Mode OR Multiple Choice -->
                ${isTyping ? `
                  <form id="drillTypeForm" class="space-y-2.5">
                    <div class="flex flex-wrap items-center gap-1">
                      <span class="text-xs text-[var(--muted-foreground)] mr-1">Accents:</span>
                      ${['é', 'è', 'ê', 'à', 'ç', 'ô', 'û', 'î', 'ù', '’'].map((ch) => `<button type="button" data-drill-accent="${escAttr(ch)}" class="px-2 py-1 rounded-md bg-[var(--content)] border border-[var(--border)] text-xs font-semibold tint-muted-hover cursor-pointer">${ch}</button>`).join('')}
                    </div>
                    <div class="flex flex-wrap sm:flex-nowrap gap-2">
                      <input

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    ${(state.drillMode === 'gender' ? [0, 1] : getShuffledOrder(`${state.drillMode}_${state.drillIdx}_${item.answer}`, item.choices.length)).map((cIdx) => {

                        else if (c === state.drillAnswered) cls = 'tint-error border-error-soft text-[var(--error)]';
                        else cls = 'bg-[var(--content)] border-[var(--border)] text-[var(--muted-foreground)] opacity-60';

                      return `<button type="button" data-drill-choice="${escAttr(c)}" class="text-left px-4 py-3 rounded-xl border text-sm transition cursor-pointer ${cls}">${esc(c)}</button>`;

                `}

                <!-- Feedback & Next -->
                ${state.drillAnswered !== null ? `
                  <div class="p-3.5 rounded-xl border flex flex-wrap items-center justify-between gap-3 ${
                    isCorrectAnswer ? 'tint-success border-success-soft' : 'tint-warning border-warning-soft'
                  }">
                    <div class="text-xs space-y-0.5">
                      <div>
                        <strong>${isCorrectAnswer ? (closeAccentMatch ? 'Correct — watch accents! ✓ (+8 XP)' : `Exact ! ✓ (+${isTyping ? 8 : 5} XP)`) : `Answer: ${esc(isTyping ? expectedTyped : item.answer)}`}</strong>
                        ${item.exp ? `<span class="ml-1">— ${esc(item.exp)}</span>` : ''}
                      </div>
                      ${closeAccentMatch ? `<div class="text-[var(--muted-foreground)]">Exact spelling: <strong>${esc(expectedTyped)}</strong></div>` : ''}
                    </div>
                    <button type="button" id="btnNextDrill" class="px-4 py-2 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold cursor-pointer">
                      Next Question →
                    </button>
                  </div>
                ` : ''}
              </section>

            ${state.drillMode === 'mistakes' ? (() => {
              const tags = ['Gender', 'Preposition', 'Tense', 'Subjunctive', 'Pronoun', 'Liaison/Sound', 'Faux Ami', 'Register'];
              const presentTags = [...new Set(state.customErrors.map((e) => e.tag))];
              const shownErrors = state.customErrorFilter === 'all'
                ? state.customErrors
                : state.customErrors.filter((e) => e.tag === state.customErrorFilter);
              return `
                <section class="bg-[var(--card)] border border-[var(--card-border)] rounded-2xl p-5 space-y-4">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <h3 class="text-base font-bold text-[var(--foreground)]">📝 My Personal Error Log (错句本)</h3>
                      <p class="text-xs text-[var(--muted-foreground)] mt-0.5">Save mistakes from tutors, AI chats, or real conversations with the exact rule so you stop repeating them.</p>
                    </div>

                  </div>

                  <form id="customErrorForm" class="p-4 rounded-xl bg-[var(--content)] border border-[var(--border)] grid grid-cols-1 md:grid-cols-2 gap-2.5">
                    <input id="ceWrong" type="text" required placeholder="What I said/wrote (e.g. J’ai beaucoup des amis)" class="px-3 py-2 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs text-[var(--foreground)]" />
                    <input id="ceRight" type="text" required placeholder="Correct French (e.g. J’ai beaucoup d’amis)" class="px-3 py-2 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs text-[var(--foreground)]" />
                    <select id="ceTag" class="px-3 py-2 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs text-[var(--foreground)] cursor-pointer">
                      ${tags.map((t) => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                    <input id="ceWhy" type="text" placeholder="Why? Rule note (e.g. beaucoup de — never des!)" class="px-3 py-2 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs text-[var(--foreground)]" />
                    <div class="md:col-span-2 flex justify-end">
                      <button type="submit" class="px-4 py-2 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold cursor-pointer">+ Save to 错句本 (+5 XP)</button>
                    </div>
                  </form>

                  ${presentTags.length > 0 ? `
                    <div class="flex flex-wrap gap-1.5">
                      <button type="button" data-ce-filter="all" class="px-2.5 py-1 rounded-lg text-xs font-semibold border cursor-pointer ${state.customErrorFilter === 'all' ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent' : 'bg-[var(--content)] border-[var(--border)] text-[var(--muted-foreground)]'}">All (${state.customErrors.length})</button>
                      ${presentTags.map((tg) => `
                        <button type="button" data-ce-filter="${escAttr(tg)}" class="px-2.5 py-1 rounded-lg text-xs font-semibold border cursor-pointer ${state.customErrorFilter === tg ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent' : 'bg-[var(--content)] border-[var(--border)] text-[var(--muted-foreground)]'}">${esc(tg)}</button>
                      `).join('')}
                    </div>
                  ` : ''}

                  ${shownErrors.length === 0 ? `
                    <div class="text-xs text-[var(--muted-foreground)] text-center py-3">No personal errors logged yet — add your first correction above!</div>
                  ` : `
                    <div class="space-y-2">
                      ${shownErrors.map((ce) => `
                        <div class="p-3.5 rounded-xl bg-[var(--content)] border border-[var(--border)] flex flex-wrap items-start justify-between gap-3">
                          <div class="space-y-1 min-w-0 flex-1">
                            <div class="flex flex-wrap items-center gap-2 text-xs">
                              <span class="px-2 py-0.5 rounded-full tint-primary text-[var(--primary)] font-bold">${esc(ce.tag)}</span>
                              <span class="line-through text-[var(--error)]">${esc(ce.wrong)}</span>
                              <span>→</span>
                              <strong class="text-[var(--success)]">${esc(ce.right)}</strong>
                            </div>
                            ${ce.why ? `<div class="text-xs text-[var(--muted-foreground)]">💡 ${esc(ce.why)}</div>` : ''}
                          </div>
                          <div class="flex items-center gap-1.5 shrink-0">
                            <button type="button" data-speak="${escAttr(ce.right)}" class="speak-btn px-2.5 py-1 rounded-lg bg-[var(--card)] border border-[var(--border)] text-xs cursor-pointer">🔊</button>
                            <button type="button" data-ce-del="${ce.id}" class="px-2.5 py-1 rounded-lg tint-success text-[var(--success)] text-xs font-semibold cursor-pointer">✓ Mastered</button>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  `}
                </section>
              `;
            })() : ''}
          </div>
        `;

        bindPracticeTopBar();
        els.mainContent.querySelectorAll('[data-drill-mode]').forEach((b) => {
          b.onclick = () => {
            stopAudio();
            state.drillMode = b.dataset.drillMode;
            state.drillInputMode = state.drillMode === 'dictation' ? 'type' : 'choices';
            state.drillIdx = 0;
            state.drillAnswered = null;
            state.drillTypedValue = '';
            if (state.drillMode === 'topics') {
              state.activeTopicQuizId = null;
              state.topicQuizFinished = false;
            }
            renderDrillsView();
          };
        });
        els.mainContent.querySelectorAll('[data-input-mode]').forEach((b) => {
          b.onclick = () => {
            state.drillInputMode = b.dataset.inputMode;
            state.drillAnswered = null;
            state.drillTypedValue = '';
            renderDrillsView();
          };
        });
        document.getElementById('drillLevelSel').onchange = (e) => {
          state.drillLevel = e.target.value;
          state.drillIdx = 0;
          state.drillAnswered = null;
          state.drillTypedValue = '';
          renderDrillsView();
        };

        const btnAudio = document.getElementById('btnPlayDrillAudio');
        if (btnAudio && item) btnAudio.onclick = () => speakPhrase(item.audio);
        const btnSlow = document.getElementById('btnPlayDrillSlow');
        if (btnSlow && item) btnSlow.onclick = () => speakPhrase(item.audio, 0.72);
        els.mainContent.querySelectorAll('.speak-btn').forEach((b) => (b.onclick = () => speakPhrase(b.dataset.speak)));
        els.mainContent.querySelectorAll('[data-open-topic-quiz]').forEach((b) => (b.onclick = () => openTopicQuiz(b.dataset.openTopicQuiz)));
        if (isTopics) bindTopicQuizEvents();

        function handleDrillSubmit(userVal, typed) {
          if (state.drillAnswered !== null || !item) return;
          state.drillAnswered = userVal;
          state.drillTotal++;
          const expected = typed ? expectedTyped : item.answer;
          const ok = typed
            ? (normalizeFr(userVal) === normalizeFr(expected) || stripAccents(normalizeFr(userVal)) === stripAccents(normalizeFr(expected)))
            : userVal === expected;

          if (ok) {
            state.drillScore++;
            addXP(typed ? 8 : 5);
            if (state.drillMode === 'mistakes') {
              resolveMistakeCorrect(item.id);
              renderSidebar();
            }
          } else {
            if (state.drillMode === 'mistakes') {
              item.streakRight = 0;
              saveState();
            } else {
              recordMistake({
                id: `dr_${state.drillMode}_${state.drillIdx}`,
                source: `Drill (${state.drillMode})`,
                level: item.level,
                prompt: item.prompt || (item.full ? `Gender: ___ ${item.word}` : item.word ? `Faux Ami: ${item.word} (« ${item.context} »)` : 'Listen and choose meaning'),
                audio: item.audio || '',
                choices: item.choices,
                answer: item.answer,
                exp: item.exp || item.hint || ''
              });
              renderSidebar();
            }
          }

          if (state.drillMode === 'conjugation' || state.drillMode === 'cloze') {
            speakPhrase(item.prompt.replace('___', item.answer).replace(/^[^:]+:\s*/, ''));
          } else if (state.drillMode === 'gender' && item.full) {
            speakPhrase(item.full);
          }
          renderDrillsView();
        }

        els.mainContent.querySelectorAll('[data-drill-choice]').forEach((b) => {
          b.onclick = () => handleDrillSubmit(b.dataset.drillChoice, false);
        });

        const typeForm = document.getElementById('drillTypeForm');
        const typeInp = document.getElementById('drillTypeInput');
        if (typeForm && typeInp) {
          if (state.drillAnswered === null) typeInp.focus();
          typeInp.oninput = () => { state.drillTypedValue = typeInp.value; };
          els.mainContent.querySelectorAll('[data-drill-accent]').forEach((b) => {
            b.onclick = () => {
              const ins = b.dataset.drillAccent;
              const start = typeInp.selectionStart || typeInp.value.length;
              const end = typeInp.selectionEnd || typeInp.value.length;
              typeInp.value = typeInp.value.slice(0, start) + ins + typeInp.value.slice(end);
              typeInp.focus();
              typeInp.selectionStart = typeInp.selectionEnd = start + ins.length;
              state.drillTypedValue = typeInp.value;
            };
          });
          typeForm.onsubmit = (e) => {
            e.preventDefault();
            if (!typeInp.value.trim()) return;
            handleDrillSubmit(typeInp.value.trim(), true);
          };
        }

        const btnNext = document.getElementById('btnNextDrill');
        if (btnNext) {
          btnNext.onclick = () => {
            stopAudio();
            const curItems = getFilteredDrills();
            state.drillIdx = curItems.length ? (state.drillIdx + 1) % curItems.length : 0;
            state.drillAnswered = null;
            state.drillTypedValue = '';
            renderDrillsView();
          };
        }

        const ceForm = document.getElementById('customErrorForm');
        if (ceForm) {
          ceForm.onsubmit = (e) => {
            e.preventDefault();
            const wrong = (document.getElementById('ceWrong').value || '').trim();
            const right = (document.getElementById('ceRight').value || '').trim();
            const tag = document.getElementById('ceTag').value || 'Grammar';
            const why = (document.getElementById('ceWhy').value || '').trim();
            if (!wrong || !right) return;
            state.customErrors.unshift({ id: `ce_${Date.now()}`, wrong, right, tag, why, ts: Date.now() });
            addXP(5);
            renderSidebar();
            renderDrillsView();
          };
        }
        els.mainContent.querySelectorAll('[data-ce-filter]').forEach((b) => {
          b.onclick = () => {
            state.customErrorFilter = b.dataset.ceFilter;
            renderDrillsView();
          };
        });
        els.mainContent.querySelectorAll('[data-ce-del]').forEach((b) => {
          b.onclick = () => {
            state.customErrors = state.customErrors.filter((x) => x.id !== b.dataset.ceDel);
            saveState();
            renderSidebar();
            renderDrillsView();
          };
        });
      }

      /* =========================================================
         14. VIEW 4: SRS VOCABULARY BANK & 3D FLASHCARDS
      ========================================================= */
      const DAY_MS = 24 * 3600 * 1000;

      function toggleVocabMastered(id) {
        const cur = state.vocabSRS[id] || { mastered: false, box: 1, nextDue: 0 };
        cur.mastered = !cur.mastered;
        cur.box = cur.mastered ? 4 : 1;
        cur.nextDue = cur.mastered ? Date.now() + 14 * DAY_MS : Date.now();
        state.vocabSRS[id] = cur;
        if (cur.mastered) addXP(3);
        saveState();
        renderSidebar();
      }

      function rateFlashcard(id, rating) {
        const cur = state.vocabSRS[id] || { mastered: false, box: 1, nextDue: 0 };
        const now = Date.now();
        if (rating === 'again') { cur.box = 1; cur.mastered = false; cur.nextDue = now; }
        else if (rating === 'hard') { cur.box = Math.max(1, cur.box); cur.mastered = false; cur.nextDue = now + 1 * DAY_MS; }
        else if (rating === 'good') {
          cur.box = Math.min(4, cur.box + 1);
          cur.mastered = cur.box >= 3;
          const days = cur.box === 2 ? 3 : cur.box === 3 ? 7 : 14;
          cur.nextDue = now + days * DAY_MS;
          addXP(3);
        } else if (rating === 'easy') {
          cur.box = 4;
          cur.mastered = true;
          cur.nextDue = now + 21 * DAY_MS;
          addXP(5);
        }
        state.vocabSRS[id] = cur;
        saveState();
        renderSidebar();
      }

      function getFilteredVocab() {
        return ALL_VOCAB.filter((v) => {
          if (state.vocabLevel !== 'all' && v.level !== state.vocabLevel) return false;
          if (state.vocabCat !== 'all' && v.cat !== state.vocabCat) return false;
          if (state.vocabHideMastered && state.vocabSRS[v.id] && state.vocabSRS[v.id].mastered) return false;
          if (state.vocabDueOnly && !isVocabDue(v.id)) return false;
          return true;
        });
      }

      function setupVocabQuiz(items) {
        if (items.length < 4) { state.vQuizItem = null; return; }
        const target = items[Math.floor(Math.random() * items.length)];
        const pool = ALL_VOCAB.filter((x) => x.id !== target.id);
        const distractors = [];
        while (distractors.length < 3 && pool.length > 0) {
          const idx = Math.floor(Math.random() * pool.length);
          distractors.push(pool.splice(idx, 1)[0]);
        }
        const opts = [target, ...distractors].sort(() => Math.random() - 0.5);
        state.vQuizItem = target;
        state.vQuizOptions = opts;
        state.vQuizChoice = null;
      }

      function renderVocabView() {
        const items = getFilteredVocab();
        if (state.flashIdx >= items.length) state.flashIdx = 0;
        const cats = [...new Set(ALL_VOCAB.map((v) => v.cat))];
        const dueTotal = countDueVocab();

        if (state.vocabMode === 'quiz' && (!state.vQuizItem || !items.some((x) => x.id === state.vQuizItem.id))) {
          setupVocabQuiz(items.length >= 4 ? items : ALL_VOCAB);
        }

        els.mainContent.innerHTML = `
          <div class="space-y-5">
            ${state.activeView === 'practice' ? renderPracticeTopBarHTML() : ''}
            <div>
              <h2 class="text-xl font-bold">🗂️ SRS Flashcard Deck &amp; Faux Amis</h2>
              <p class="text-sm text-[var(--muted-foreground)] mt-1">
                ${ALL_VOCAB.length} A1–B2 expressions • Due today: <strong class="text-[var(--primary)]">${dueTotal}</strong> • Mastered: <strong class="text-[var(--success)]">${countMasteredVocab()}</strong>
              </p>
              <p class="text-xs text-[var(--muted-foreground)] mt-0.5">
                <strong>SRS</strong> = Spaced Repetition (auto-scheduled review) · <strong>Faux Amis</strong> = English-French “false friends”${state.showZh ? ' · 间隔重复记忆 + 假朋友易混词' : ''}
              </p>
            </div>

            <!-- Controls -->
            <div class="bg-[var(--card)] border border-[var(--card-border)] p-3.5 rounded-2xl flex flex-wrap items-center justify-between gap-3">
              <div class="inline-flex p-1 rounded-xl bg-[var(--content)] border border-[var(--border)]">
                ${[
                  { id: 'flashcards', label: '🃏 SRS Flashcards' },
                  { id: 'list', label: '📋 List' },
                  { id: 'quiz', label: '⚡ Quick Quiz' }
                ].map((m) => `
                  <button type="button" data-vmode="${m.id}" class="px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer ${
                    state.vocabMode === m.id ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'
                  }">${m.label}</button>

      /* =========================================================
         15. VIEW 5: TCF CANADA TIMED MOCK EXAM (CO & CE)

      function computeTCFScore(exam, answers, mockKey) {
        let earned = 0;
        let maxW = 0;
        let correctCount = 0;
        exam.questions.forEach((q) => {
          maxW += q.weight;
          if (answers[q.id] === q.ans) {
            earned += q.weight;
            correctCount++;
          }
        });
        const ratio = maxW ? earned / maxW : 0;
        const isSprint = mockKey === 'co2' || mockKey === 'ce2';
        const isCE = String(mockKey || '').startsWith('ce');
        // Set 2 has only B1-B2+ items (no A1/A2 easy floor), so floor starts at B1 (280)
        const tcf = isSprint ? Math.round(280 + ratio * 370) : Math.round(120 + ratio * 530);
        const passScore = isCE ? 453 : 458; // Official IRCC CLB 7: CE 453, CO 458
        let clb = 'CLB 4 (A2)';
        if (isCE) {
          if (tcf >= 524) clb = 'CLB 9+ (C1)';
          else if (tcf >= 499) clb = 'CLB 8 (B2+)';
          else if (tcf >= 453) clb = 'CLB 7 (B2 — PASS!)';
          else if (tcf >= 406) clb = 'CLB 6 (B1+)';
          else if (tcf >= 375) clb = 'CLB 5 (B1)';
        } else {
          if (tcf >= 523) clb = 'CLB 9+ (C1)';
          else if (tcf >= 503) clb = 'CLB 8 (B2+)';
          else if (tcf >= 458) clb = 'CLB 7 (B2 — PASS!)';
          else if (tcf >= 398) clb = 'CLB 6 (B1+)';
          else if (tcf >= 369) clb = 'CLB 5 (B1)';
        }
        return { tcf, clb, correctCount, total: exam.questions.length, passed: tcf >= passScore, passScore };
      }

      function startMockExam() {
        const exam = MOCK_EXAMS[state.mockType];
        stopAudio();
        clearTimers();
        state.mockRunning = true;
        state.mockFinished = false;
        state.mockIdx = 0;
        state.mockAnswers = {};
        state.mockPlayedIds = {};
        state.mockShuffleSeed = String(Date.now());
        state.mockTimeLeft = exam.durationSec;

        state.mockTimerHandle = setInterval(() => {
          state.mockTimeLeft--;
          const tEl = document.getElementById('mockTimerReadout');
          if (tEl) tEl.textContent = formatTime(state.mockTimeLeft);
          if (state.mockTimeLeft <= 0) {
            finishMockExam();
          }
        }, 1000);
        renderMockView();
      }

      function finishMockExam() {
        clearTimers();
        stopAudio();
        const exam = MOCK_EXAMS[state.mockType];
        if (exam) {
          exam.questions.forEach((q) => {
            if (state.mockAnswers[q.id] !== q.ans) {
              recordMistake({
                id: `mock_${q.id}`,
                source: `Mock ${state.mockType.toUpperCase()}`,
                level: q.level,
                prompt: q.passage ? `${q.passage}\n\nQ: ${q.question}` : q.question,
                audio: q.audio || '',
                choices: q.options,
                answer: q.options[q.ans],
                exp: q.exp
              });
            }
          });
        }
        state.mockRunning = false;
        state.mockFinished = true;
        addXP(40);
        renderSidebar();
        renderMockView();
      }

         16. VIEW 6: WRITING (EE) & SPEAKING (EO) LAB
