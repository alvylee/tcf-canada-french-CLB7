  <style>
    :root {
      --background: #FAF8F5;
      --sidebar: #FFFFFF;
      --card: #FFFFFF;
      --content: #F6F4EF;
      --border: #E5E0D6;
      --card-border: #E2DDD3;
      --foreground: #18212F;
      --muted-foreground: #5B6678;
      --primary: #3730A3;
      --primary-foreground: #FFFFFF;
      --secondary: #F3F0EA;
      --secondary-foreground: #18212F;
      --link: #3730A3;
      --success: #15803D;
      --warning: #B45309;
      --error: #B91C1C;
    }
    html.dark {
      --background: #0F141E;
      --sidebar: #141B29;
      --card: #182131;
      --content: #111826;
      --border: #28354D;
      --card-border: #2B3952;
      --foreground: #F1F5F9;
      --muted-foreground: #94A3B8;
      --primary: #818CF8;
      --primary-foreground: #0F141E;
      --secondary: #1E293B;
      --secondary-foreground: #F1F5F9;
      --link: #93C5FD;
      --success: #4ADE80;
      --warning: #FBBF24;
      --error: #F87171;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-size: 14px;
      line-height: 1.55;
      margin: 0;
      padding: 0;
    }

    /* Subtle tinted semantic surfaces that adapt to light & dark themes */
    .tint-primary { background-color: color-mix(in srgb, var(--primary) 12%, transparent); }
    .tint-primary-strong { background-color: color-mix(in srgb, var(--primary) 18%, transparent); }
    .tint-success { background-color: color-mix(in srgb, var(--success) 13%, transparent); }
    .tint-warning { background-color: color-mix(in srgb, var(--warning) 14%, transparent); }
    .tint-error { background-color: color-mix(in srgb, var(--error) 13%, transparent); }
    .tint-muted { background-color: color-mix(in srgb, var(--foreground) 5%, transparent); }
    .tint-muted-hover:hover { background-color: color-mix(in srgb, var(--foreground) 8%, transparent); }

    .border-primary-soft { border-color: color-mix(in srgb, var(--primary) 35%, transparent); }
    .border-success-soft { border-color: color-mix(in srgb, var(--success) 40%, transparent); }
    .border-warning-soft { border-color: color-mix(in srgb, var(--warning) 42%, transparent); }
    .border-error-soft { border-color: color-mix(in srgb, var(--error) 40%, transparent); }

    /* Audio wave animation */
    @keyframes waveBounce {
      0%, 100% { transform: scaleY(0.28); }
      50% { transform: scaleY(1); }
    }
    .wave-bar {
      transform-origin: bottom;
      transition: transform 0.2s ease;
    }
    .is-playing .wave-bar {
      animation: waveBounce 0.72s ease-in-out infinite;
    }
    .is-playing .wave-bar:nth-child(2) { animation-delay: 0.14s; }
    .is-playing .wave-bar:nth-child(3) { animation-delay: 0.28s; }
    .is-playing .wave-bar:nth-child(4) { animation-delay: 0.42s; }

    /* 3D Flashcard Flip */
    .perspective-1000 { perspective: 1000px; }
    .flip-card-inner {
      transition: transform 0.48s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flip-card.is-flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flip-card-back { transform: rotateY(180deg); }

    /* Clean scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--muted-foreground) 35%, transparent);
      border-radius: 9999px;
    }

    /* Active sentence highlight */
    .sentence-active {
      border-color: var(--primary) !important;
      background-color: color-mix(in srgb, var(--primary) 12%, transparent) !important;
    }
  </style>
</head>

        const d = new Date();

        if (!set.has(keyToday)) d.setDate(d.getDate() - 1);
        while (true) {

          if (set.has(k)) { streak++; d.setDate(d.getDate() - 1); }

        return streak;

          setTimeout(() => { btnEl.textContent = prev; }, 2200);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
        } else {
          fallbackCopy(text, done);
        }
      }

      const NEURAL_AUDIO = (typeof window !== 'undefined' && window.__TCF_NEURAL_AUDIO__) ? window.__TCF_NEURAL_AUDIO__ : {};

      function fnv1a(str) {
        let h = 0x811c9dc5;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 0x01000193) >>> 0;
        }
        return h.toString(16).padStart(8, '0');
      }

      function base64ToUint8(b64) {
        const bin = atob(b64);
        const len = bin.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      function getNeuralClip(text) {
        if (!text) return null;
        const key = fnv1a(String(text).trim());
        const item = NEURAL_AUDIO[key];
        return item ? { key, v: item.v, d: item.d } : null;
      }

        const neuralAvailable = hasNeuralPack();
        els.voiceSelect.innerHTML = '';

        if (neuralAvailable) {
          const optN = document.createElement('option');
          optN.value = '__neural__';
          optN.textContent = '✨ Studio Human Voices (FR + CA)';
          els.voiceSelect.appendChild(optN);
        }

        if (state.speechSupported) {
          try {
            const all = window.speechSynthesis.getVoices() || [];
            const fr = all.filter((v) => v.lang && v.lang.toLowerCase().startsWith('fr'));
            fr.sort((a, b) => {
              const score = (v) => {
                let s = 0;
                const name = v.name || '';
                const l = (v.lang || '').toLowerCase();
                // Strongly prefer modern neural/natural/online/Google/enhanced voices over robotic local voices
                if (/online|natural|neural|multilingual/i.test(name)) s += 70;
                else if (/google/i.test(name)) s += 55;
                else if (/enhanced|premium|siri|eloquence/i.test(name)) s += 40;
                if (l === 'fr-ca' || l === 'fr_ca') s += 12;
                else if (l === 'fr-fr' || l === 'fr_fr') s += 10;
                if (/espeak|compact/i.test(name)) s -= 40;
                return s;
              };
              return score(b) - score(a);
            });
            state.frenchVoices = fr;

            if (fr.length > 0) {
              const grp = document.createElement('optgroup');
              grp.label = 'Browser Fallback Voices';
              fr.forEach((v) => {
                const opt = document.createElement('option');
                opt.value = v.voiceURI;
                const reg = v.lang.toLowerCase().includes('ca') ? 'CA' : v.lang.toLowerCase().includes('fr') ? 'FR' : v.lang;
                const isNat = /online|natural|neural|google|enhanced|premium/i.test(v.name || '');
                opt.textContent = `${isNat ? '★ ' : ''}${v.name.slice(0, 22)} (${reg})`;
                grp.appendChild(opt);
              });
              els.voiceSelect.appendChild(grp);
            }
          } catch (e) {}
        }

        // Always default to Studio Human Voices when available (even if old localStorage had a robotic browser voice saved)
        if (neuralAvailable && (!state.selectedVoiceURI || state.selectedVoiceURI === '__neural__' || !state.frenchVoices.some((v) => v.voiceURI === state.selectedVoiceURI))) {
          state.selectedVoiceURI = '__neural__';
        } else if (!neuralAvailable && state.frenchVoices.length > 0 && !state.frenchVoices.some((v) => v.voiceURI === state.selectedVoiceURI)) {
          state.selectedVoiceURI = state.frenchVoices[0].voiceURI;
        }
        els.voiceSelect.value = state.selectedVoiceURI;
      }

        if (state.activeAudioEl) {
          try {
            state.activeAudioEl.onended = null;
            state.activeAudioEl.onerror = null;
            state.activeAudioEl.pause();
            state.activeAudioEl.currentTime = 0;
          } catch (e) {}
          state.activeAudioEl = null;
        }
        if (state.activeWebAudioSrc) {
          try {
            state.activeWebAudioSrc.onended = null;
            state.activeWebAudioSrc.stop();
          } catch (e) {}
          state.activeWebAudioSrc = null;
        }
        if (state.speechSupported) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        updateAudioUI();
      }

      function playNeuralWithWebAudio(clip, rate, tok, { onEnd, onError }) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) { if (onError) onError(); return; }
          if (!state.audioCtx) state.audioCtx = new AC();
          const ctx = state.audioCtx;
          if (ctx.state === 'suspended') ctx.resume();

          const playBuffer = (audioBuffer) => {
            if (tok !== state.playbackToken) return;
            const src = ctx.createBufferSource();
            src.buffer = audioBuffer;
            src.playbackRate.value = rate;
            src.connect(ctx.destination);
            state.activeWebAudioSrc = src;
            src.onended = () => {
              if (state.activeWebAudioSrc === src) state.activeWebAudioSrc = null;
              if (tok === state.playbackToken && onEnd) onEnd();
            };
            src.start(0);
          };

          if (NEURAL_ABUF_CACHE[clip.key]) {
            playBuffer(NEURAL_ABUF_CACHE[clip.key]);
            return;
          }
          const bytes = base64ToUint8(clip.d);
          ctx.decodeAudioData(
            bytes.buffer.slice(0),
            (decoded) => {
              NEURAL_ABUF_CACHE[clip.key] = decoded;
              playBuffer(decoded);
            },
            () => { if (onError) onError(); }
          );
        } catch (e) {
          if (onError) onError();
        }
      }

      function playNeuralClip(clip, rate, tok, { onEnd, onError }) {
        state.activeSpeakerLabel = clip.v;
        updateAudioUI();
        try {
          if (!NEURAL_BLOB_CACHE[clip.key]) {
            const bytes = base64ToUint8(clip.d);
            const blob = new Blob([bytes], { type: 'audio/mpeg' });
            NEURAL_BLOB_CACHE[clip.key] = URL.createObjectURL(blob);
          }
          const audio = new Audio(NEURAL_BLOB_CACHE[clip.key]);
          audio.playbackRate = rate;
          audio.preservesPitch = true;
          audio.mozPreservesPitch = true;
          audio.webkitPreservesPitch = true;
          state.activeAudioEl = audio;

          audio.onended = () => {
            if (state.activeAudioEl === audio) state.activeAudioEl = null;
            if (tok === state.playbackToken && onEnd) onEnd();
          };
          audio.onerror = () => {
            if (state.activeAudioEl === audio) state.activeAudioEl = null;
            if (tok === state.playbackToken) {
              playNeuralWithWebAudio(clip, rate, tok, { onEnd, onError });
            }
          };

          const playPromise = audio.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {
              if (state.activeAudioEl === audio) state.activeAudioEl = null;
              if (tok === state.playbackToken) {
                playNeuralWithWebAudio(clip, rate, tok, { onEnd, onError });
              }
            });
          }
        } catch (e) {
          playNeuralWithWebAudio(clip, rate, tok, { onEnd, onError });
        }
      }

      function speakBrowserTTS(text, rate, { onEnd, onError }) {
        if (!state.speechSupported) {
          showSpeechWarn('Browser TTS unavailable for custom text. All built-in lessons use Studio Human Voices.');
          if (onError) onError();
          return;
        }
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.rate = rate;
          u.pitch = 1.0;
          const chosen =
            (state.selectedVoiceURI !== '__neural__' && state.frenchVoices.find((v) => v.voiceURI === state.selectedVoiceURI)) ||
            state.frenchVoices[0];
          if (chosen) {
            u.voice = chosen;
            u.lang = chosen.lang;
            state.activeSpeakerLabel = chosen.name.slice(0, 16);
          } else {
            u.lang = 'fr-CA';
            state.activeSpeakerLabel = 'Browser FR';
          }
          updateAudioUI();
          u.onend = () => { if (onEnd) onEnd(); };
          u.onerror = () => { if (onError) onError(); };
          window.speechSynthesis.speak(u);
        } catch (e) {
          if (onError) onError();
        }
      }

      function speakRaw(text, { onEnd, onError, rateOverride, tok } = {}) {
        const rate = rateOverride || state.speed;
        const activeTok = tok !== undefined ? tok : state.playbackToken;
        if (state.selectedVoiceURI === '__neural__' || !state.selectedVoiceURI) {
          const clip = getNeuralClip(text);
          if (clip) {
            playNeuralClip(clip, rate, activeTok, {
              onEnd,
              onError: () => speakBrowserTTS(text, rate, { onEnd, onError })
            });
            return;
          }
        }
        speakBrowserTTS(text, rate, { onEnd, onError });
      }

      function speakPhrase(text, rateOverride) {
        stopAudio();
        const tok = ++state.playbackToken;
        state.isSpeaking = true;
        updateAudioUI();
        speakRaw(text, {
          rateOverride,
          tok,
          onEnd: () => { if (tok === state.playbackToken) { state.isSpeaking = false; state.activeSpeakerLabel = ''; updateAudioUI(); } },
          onError: () => { if (tok === state.playbackToken) { state.isSpeaking = false; state.activeSpeakerLabel = ''; updateAudioUI(); } }
        });
      }

      function playSequence(passageId, sentences) {
        if (state.isSpeaking && state.activePassageId === passageId) {
          stopAudio();
          return;
        }
        stopAudio();
        const tok = ++state.playbackToken;
        state.isSpeaking = true;
        state.activePassageId = passageId;
        updateAudioUI();

        function step(i) {
          if (tok !== state.playbackToken) return;
          if (i >= sentences.length) {
            state.isSpeaking = false;
            state.activeSpeakerLabel = '';
            state.activePassageId = null;
            state.activeSentenceIdx = null;
            updateAudioUI();
            return;
          }
          state.activeSentenceIdx = i;
          updateAudioUI();
          speakRaw(sentences[i], {
            tok,
            onEnd: () => {
              if (tok !== state.playbackToken) return;
              setTimeout(() => { if (tok === state.playbackToken) step(i + 1); }, 240);
            },
            onError: () => {
              if (tok === state.playbackToken) {
                state.isSpeaking = false;
                state.activeSpeakerLabel = '';
                state.activePassageId = null;
                state.activeSentenceIdx = null;
                updateAudioUI();
              }
            }
          });
        }
        step(0);
      }

      function getFilteredDrills() {
        if (state.drillMode === 'mistakes') {
          return state.drillLevel === 'all' ? state.mistakes : state.mistakes.filter((x) => x.level === state.drillLevel);
        }
        const list = DRILLS[state.drillMode] || [];
        return state.drillLevel === 'all' ? list : list.filter((x) => x.level === state.drillLevel);
      }

      function renderDrillsView() {
        const items = getFilteredDrills();
        if (state.drillIdx >= items.length) state.drillIdx = 0;
        const item = items[state.drillIdx];

        const modes = [
          { id: 'conjugation', label: '🔤 Conjugation' },
          { id: 'cloze', label: '🧩 Connectors & Cloze' },
          { id: 'dictation', label: '🎧 Listening / Dictation' },
          { id: 'fauxamis', label: '⚠️ Faux Amis' },
          { id: 'mistakes', label: `🔁 Missed Items (${state.mistakes.length})` }
        ];

        const supportsTyping = state.drillMode === 'conjugation' || state.drillMode === 'cloze' || state.drillMode === 'dictation';
        const isTyping = supportsTyping && state.drillInputMode === 'type';
        const expectedTyped = item ? (state.drillMode === 'dictation' ? item.audio : item.answer) : '';

        let isCorrectAnswer = false;
        let closeAccentMatch = false;
        if (state.drillAnswered !== null && item) {
          if (isTyping) {

        els.mainContent.querySelectorAll('[data-drill-mode]').forEach((b) => {

        els.mainContent.querySelectorAll('[data-input-mode]').forEach((b) => {

            state.drillAnswered = null;
            state.drillTypedValue = '';
            renderDrillsView();
          };
        });
        document.getElementById('drillLevelSel').onchange = (e) => {
          state.drillLevel = e.target.value;
          state.drillIdx = 0;
          state.drillAnswered = null;
          state.drillTypedValue = '';
          renderDrillsView();
        };

        const btnAudio = document.getElementById('btnPlayDrillAudio');
        if (btnAudio && item) btnAudio.onclick = () => speakPhrase(item.audio);
        const btnSlow = document.getElementById('btnPlayDrillSlow');
        if (btnSlow && item) btnSlow.onclick = () => speakPhrase(item.audio, 0.72);
        els.mainContent.querySelectorAll('.speak-btn').forEach((b) => (b.onclick = () => speakPhrase(b.dataset.speak)));

        function handleDrillSubmit(userVal, typed) {
          if (state.drillAnswered !== null || !item) return;
          state.drillAnswered = userVal;
          state.drillTotal++;
          const expected = typed ? expectedTyped : item.answer;
          const ok = typed
            ? (normalizeFr(userVal) === normalizeFr(expected) || stripAccents(normalizeFr(userVal)) === stripAccents(normalizeFr(expected)))
            : userVal === expected;

          if (ok) {
            state.drillScore++;
            addXP(typed ? 8 : 5);
            if (state.drillMode === 'mistakes') {
              resolveMistakeCorrect(item.id);
              renderSidebar();
            }
          } else {
            if (state.drillMode === 'mistakes') {
              item.streakRight = 0;
              saveState();
            } else {
              recordMistake({
                id: `dr_${state.drillMode}_${state.drillIdx}`,

              });

          if (state.drillMode === 'conjugation' || state.drillMode === 'cloze') {

          renderDrillsView();
        }

          b.onclick = () => handleDrillSubmit(b.dataset.drillChoice, false);

      /* =========================================================
         14. VIEW 4: SRS VOCABULARY BANK & 3D FLASHCARDS
      ========================================================= */
      const DAY_MS = 24 * 3600 * 1000;

      function toggleVocabMastered(id) {
        const cur = state.vocabSRS[id] || { mastered: false, box: 1, nextDue: 0 };
        cur.mastered = !cur.mastered;
        cur.box = cur.mastered ? 4 : 1;
        cur.nextDue = cur.mastered ? Date.now() + 14 * DAY_MS : Date.now();
        state.vocabSRS[id] = cur;
        if (cur.mastered) addXP(3);
        saveState();
        renderSidebar();
      }

      function rateFlashcard(id, rating) {
        const cur = state.vocabSRS[id] || { mastered: false, box: 1, nextDue: 0 };
        const now = Date.now();
        if (rating === 'again') { cur.box = 1; cur.mastered = false; cur.nextDue = now; }
        else if (rating === 'hard') { cur.box = Math.max(1, cur.box); cur.mastered = false; cur.nextDue = now + 1 * DAY_MS; }
        else if (rating === 'good') {
          cur.box = Math.min(4, cur.box + 1);
          cur.mastered = cur.box >= 3;
          const days = cur.box === 2 ? 3 : cur.box === 3 ? 7 : 14;
          cur.nextDue = now + days * DAY_MS;
          addXP(3);
        } else if (rating === 'easy') {
          cur.box = 4;
          cur.mastered = true;
          cur.nextDue = now + 21 * DAY_MS;
          addXP(5);
        }
        state.vocabSRS[id] = cur;
        saveState();
        renderSidebar();
      }

      function getFilteredVocab() {
        return ALL_VOCAB.filter((v) => {
          if (state.vocabLevel !== 'all' && v.level !== state.vocabLevel) return false;
          if (state.vocabCat !== 'all' && v.cat !== state.vocabCat) return false;
          if (state.vocabHideMastered && state.vocabSRS[v.id] && state.vocabSRS[v.id].mastered) return false;
          if (state.vocabDueOnly && !isVocabDue(v.id)) return false;
          return true;
        });
      }

      function setupVocabQuiz(items) {
        if (items.length < 4) { state.vQuizItem = null; return; }
        const target = items[Math.floor(Math.random() * items.length)];
        const pool = ALL_VOCAB.filter((x) => x.id !== target.id);
        const distractors = [];
        while (distractors.length < 3 && pool.length > 0) {
          const idx = Math.floor(Math.random() * pool.length);
          distractors.push(pool.splice(idx, 1)[0]);
        }
        const opts = [target, ...distractors].sort(() => Math.random() - 0.5);
        state.vQuizItem = target;
        state.vQuizOptions = opts;
        state.vQuizChoice = null;
      }

      function renderVocabView() {
        const items = getFilteredVocab();
        if (state.flashIdx >= items.length) state.flashIdx = 0;
        const cats = [...new Set(ALL_VOCAB.map((v) => v.cat))];
        const dueTotal = countDueVocab();

        if (state.vocabMode === 'quiz' && (!state.vQuizItem || !items.some((x) => x.id === state.vQuizItem.id))) {
          setupVocabQuiz(items.length >= 4 ? items : ALL_VOCAB);
        }

        els.mainContent.innerHTML = `
          <div class="space-y-5">
            <div>
              <h2 class="text-2xl font-bold">🗂️ SRS Flashcard Deck &amp; Faux Amis</h2>
              <p class="text-sm text-[var(--muted-foreground)] mt-1">
                ${ALL_VOCAB.length} A1–B2 expressions • Due today: <strong class="text-[var(--primary)]">${dueTotal}</strong> • Mastered: <strong class="text-[var(--success)]">${countMasteredVocab()}</strong>
              </p>
            </div>

            <!-- Controls -->
            <div class="bg-[var(--card)] border border-[var(--card-border)] p-3.5 rounded-2xl flex flex-wrap items-center justify-between gap-3">
              <div class="inline-flex p-1 rounded-xl bg-[var(--content)] border border-[var(--border)]">

                  { id: 'flashcards', label: '🃏 SRS Flashcards' },

                    state.vocabMode === m.id ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'
                  }">${m.label}</button>
                `).join('')}
              </div>

              <div class="flex flex-wrap items-center gap-2">

                  <option value="A2" ${state.vocabLevel === 'A2' ? 'selected' : ''}>A2</option>
                  <option value="B1" ${state.vocabLevel === 'B1' ? 'selected' : ''}>B1</option>
                  <option value="B2" ${state.vocabLevel === 'B2' ? 'selected' : ''}>B2</option>
                </select>
                <select id="vCatSel" class="bg-[var(--content)] border border-[var(--border)] rounded-xl px-2.5 py-1.5 text-xs text-[var(--foreground)] cursor-pointer">
                  <option value="all" ${state.vocabCat === 'all' ? 'selected' : ''}>All Categories</option>
                  ${cats.map((c) => `<option value="${escAttr(c)}" ${state.vocabCat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
                </select>
                <label class="inline-flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-xl bg-[var(--content)] border border-[var(--border)] cursor-pointer">
                  <input id="vDueOnly" type="checkbox" class="accent-[var(--primary)]" ${state.vocabDueOnly ? 'checked' : ''} />
                  <span>Due Today (${dueTotal})</span>
                </label>
                <label class="inline-flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-xl bg-[var(--content)] border border-[var(--border)] cursor-pointer">
                  <input id="vHideMastered" type="checkbox" class="accent-[var(--primary)]" ${state.vocabHideMastered ? 'checked' : ''} />
                  <span>Hide Mastered</span>
                </label>
              </div>
            </div>

            ${items.length === 0 ? `
              <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-8 text-center">
                <div class="text-3xl">🎉</div>
                <div class="text-base font-bold mt-2">${state.vocabDueOnly ? 'All caught up on due flashcards today!' : 'All words in this filter are mastered!'}</div>

              </div>
            ` : state.vocabMode === 'flashcards' ? renderFlashcardHTML(items)
              : state.vocabMode === 'list' ? renderVocabListHTML(items)
              : renderVocabQuizHTML()}
          </div>
        `;

        // Bind controls
        els.mainContent.querySelectorAll('[data-vmode]').forEach((b) => (b.onclick = () => {
          state.vocabMode = b.dataset.vmode;
          state.flashFlipped = false;
          if (state.vocabMode === 'quiz') setupVocabQuiz(items.length >= 4 ? items : ALL_VOCAB);
          renderVocabView();
        }));
        document.getElementById('vLevelSel').onchange = (e) => { state.vocabLevel = e.target.value; state.flashIdx = 0; state.flashFlipped = false; renderVocabView(); };
        document.getElementById('vCatSel').onchange = (e) => { state.vocabCat = e.target.value; state.flashIdx = 0; state.flashFlipped = false; renderVocabView(); };

        els.mainContent.querySelectorAll('.speak-btn').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); speakPhrase(b.dataset.speak); }));
        els.mainContent.querySelectorAll('[data-master-vocab]').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); toggleVocabMastered(b.dataset.masterVocab); renderVocabView(); }));

        // Flashcard events
        const fc = document.getElementById('flashcardBox');
        if (fc) fc.onclick = () => { state.flashFlipped = !state.flashFlipped; fc.classList.toggle('is-flipped', state.flashFlipped); };
        const chkAudio = document.getElementById('chkAudioOnly');
        if (chkAudio) chkAudio.onchange = (e) => { state.flashAudioOnly = e.target.checked; renderVocabView(); };
        const curCard = items[state.flashIdx];
        els.mainContent.querySelectorAll('[data-srs-rate]').forEach((b) => {
          b.onclick = () => {
            if (!curCard) return;
            rateFlashcard(curCard.id, b.dataset.srsRate);
            stopAudio();

      /* =========================================================
         15. VIEW 5: TCF CANADA TIMED MOCK EXAM (CO & CE)

      function computeTCFScore(exam, answers) {
        let earned = 0;
        let maxW = 0;
        let correctCount = 0;
        exam.questions.forEach((q) => {
          maxW += q.weight;
          if (answers[q.id] === q.ans) {
            earned += q.weight;
            correctCount++;
          }
        });
        const ratio = maxW ? earned / maxW : 0;
        const tcf = Math.round(120 + ratio * 530); // maps 0..1 -> 120..650
        let clb = 'CLB 4 (A2)';
        if (tcf >= 549) clb = 'CLB 9+ (C1)';
        else if (tcf >= 503) clb = 'CLB 8 (B2+)';
        else if (tcf >= 458) clb = 'CLB 7 (B2 — PASS!)';
        else if (tcf >= 398) clb = 'CLB 6 (B1+)';
        else if (tcf >= 331) clb = 'CLB 5 (B1)';
        return { tcf, clb, correctCount, total: exam.questions.length, passed: tcf >= 458 };
      }

        const exam = MOCK_EXAMS[state.mockType];
        stopAudio();

        state.mockAnswers = {};
        state.mockPlayedIds = {};
        state.mockTimeLeft = exam.durationSec;

        state.mockTimerHandle = setInterval(() => {
          state.mockTimeLeft--;
          const tEl = document.getElementById('mockTimerReadout');
          if (tEl) tEl.textContent = formatTime(state.mockTimeLeft);
          if (state.mockTimeLeft <= 0) {
            finishMockExam();
          }
        }, 1000);
        renderMockView();
      }

      function finishMockExam() {
        clearTimers();
        stopAudio();
        const exam = MOCK_EXAMS[state.mockType];
        if (exam) {
          exam.questions.forEach((q) => {
            if (state.mockAnswers[q.id] !== q.ans) {
              recordMistake({
                id: `mock_${q.id}`,
                source: `Mock ${state.mockType.toUpperCase()}`,
                level: q.level,
                prompt: q.passage ? `${q.passage}\n\nQ: ${q.question}` : q.question,
                audio: q.audio || '',
                choices: q.options,
                answer: q.options[q.ans],
                exp: q.exp
              });
            }
          });
        }
        state.mockRunning = false;
        state.mockFinished = true;
        addXP(40);
        renderSidebar();
        renderMockView();
      }

         16. VIEW 6: WRITING (EE) & SPEAKING (EO) LAB
      ========================================================= */
      function countFrenchWords(text) {
        const cleaned = text.trim();
        if (!cleaned) return 0;
        // Official TCF counts hyphenated/apostrophe words generously by whitespace + apostrophes splits approximation
        return cleaned.split(/\s+/).filter(Boolean).length;
      }

      function analyzeWritingCLB7(text, task) {
        const wc = countFrenchWords(text);
        const lower = text.toLowerCase();
        const paragraphs = text.split(/\n\s*\n/).filter((p) => p.trim().length > 0).length;

        const connectorsFound = [
          'tout d’abord', "tout d'abord", 'd’abord', "d'abord", 'ensuite', 'de plus', 'en effet',
          'cependant', 'pourtant', 'toutefois', 'en revanche', 'certes', 'malgré', 'grâce à',
          'à cause de', 'par conséquent', 'donc', 'ainsi', 'en somme', 'en conclusion', 'alors que', 'tandis que'
        ].filter((c) => lower.includes(c));

        const b2Markers = [
          'bien que', 'quoique', 'il faut que', 'il est indispensable que', 'il est essentiel que',
          'afin que', 'pour que', 'je ne pense pas que', 'soit', 'soient', 'fasse', 'puisse', 'aient',
          'pour ma part', 'j’estime', "j'estime", 'il convient de', 'force est de constater',
          'pourrait', 'devrait', 'serait', 'faudrait'
        ].filter((m) => lower.includes(m));

        const inRange = wc >= task.minWords && wc <= task.maxWords;
        let estScore = 4;
        if (wc >= task.minWords * 0.8) estScore += 2;
        if (inRange) estScore += 2;
        if (paragraphs >= 2) estScore += 1;
        if (connectorsFound.length >= 2) estScore += 2;
        if (connectorsFound.length >= 4) estScore += 1;
        if (b2Markers.length >= 1) estScore += 2;
        if (b2Markers.length >= 3) estScore += 1;
        estScore = Math.min(16, estScore);

        const tips = [];
        if (wc < task.minWords) tips.push(`Too short (${wc} words). Aim for ${task.minWords}–${task.maxWords} words—under-length essays lose heavy TCF points.`);
        else if (wc > task.maxWords) tips.push(`Slightly over limit (${wc} words vs max ${task.maxWords}). Tighten phrasing to avoid penalties.`);
        else tips.push(`Word count (${wc} words) is right inside the TCF sweet spot (${task.minWords}–${task.maxWords})!`);

        if (paragraphs < 2) tips.push('Split into at least 2 clear paragraphs (for Tâche 3: Paragraph 1 = Synthesis, Paragraph 2 = Personal Opinion).');
        if (connectorsFound.length < 3) tips.push('Add 2–3 logical connectors (Tout d’abord, Cependant, En revanche, Par conséquent, En somme).');
        if (b2Markers.length < 2) tips.push('Boost to B2/CLB 7 by adding a subjunctive (Bien que... soit / Il est essentiel que...) or Conditionnel (il faudrait / ce serait).');

        return { wc, inRange, paragraphs, connectorsFound, b2Markers, estScore, tips };
      }

      function startEOTimer(task) {
        clearTimers();
        if (task.prepSec > 0) {
          state.eoTimerPhase = 'prep';
          state.eoTimeLeft = task.prepSec;
        } else {
          state.eoTimerPhase = 'speak';
          state.eoTimeLeft = task.speakSec;
        }
        state.eoTimerHandle = setInterval(() => {
          state.eoTimeLeft--;
          const el = document.getElementById('eoTimerReadout');
          if (el) el.textContent = formatTime(state.eoTimeLeft);
          if (state.eoTimeLeft <= 0) {
            if (state.eoTimerPhase === 'prep') {
              state.eoTimerPhase = 'speak';
              state.eoTimeLeft = task.speakSec;
              renderOutputView();
            } else {
              clearTimers();
              state.eoTimerPhase = 'done';
              renderOutputView();
            }
          }
        }, 1000);
        renderOutputView();
      }

      function toggleSpeechRecognition() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          showSpeechWarn('Live speech-to-text requires Chrome or Edge. You can still use the official timers & listen/shadow the B2 model responses!');
          return;
        }
        if (state.eoRecording && state.eoRecognition) {
          state.eoRecognition.stop();
          state.eoRecording = false;
          renderOutputView();
          return;
        }
        try {
          stopAudio();
          const rec = new SR();
          rec.lang = 'fr-CA';
          rec.continuous = true;
          rec.interimResults = true;
          rec.onresult = (e) => {
            let txt = '';
            for (let i = 0; i < e.results.length; i++) {
              txt += e.results[i][0].transcript + ' ';
            }
            state.eoTranscript = txt.trim();
            const box = document.getElementById('eoTranscriptBox');
            if (box) box.value = state.eoTranscript;
          };
          rec.onerror = () => {
            state.eoRecording = false;
            renderOutputView();
          };
          rec.onend = () => {
            state.eoRecording = false;
            renderOutputView();
          };
          rec.start();
          state.eoRecognition = rec;
          state.eoRecording = true;
          renderOutputView();
        } catch (err) {
          showSpeechWarn('Could not start microphone transcription in this browser context.');
        }
      }

                  <span class="text-sm">${esc(s)}</span>
                  <span class="text-xs shrink-0">🔊</span>
                </button>
              `).join('')}
            </div>
          </section>
        `;
      }

      function bindEOEvents() {
        const task = EO_TASKS.find((t) => t.id === state.eoTaskId) || EO_TASKS[2];
        els.mainContent.querySelectorAll('[data-eo-task]').forEach((b) => (b.onclick = () => {
          stopAudio();
          clearTimers();
          state.eoTaskId = b.dataset.eoTask;
          state.eoTimerPhase = 'idle';
          renderOutputView();
        }));
        document.getElementById('btnStartEOTimer').onclick = () => startEOTimer(task);
        document.getElementById('btnToggleMic').onclick = toggleSpeechRecognition;
        const tb = document.getElementById('eoTranscriptBox');
        if (tb) tb.oninput = () => { state.eoTranscript = tb.value; };
        const btnCopyEO = document.getElementById('btnCopyEOPacket');
        if (btnCopyEO) {
          btnCopyEO.onclick = () => {
            const spoken = (tb ? tb.value : '').trim() || '[No transcript recorded yet]';
            const packet =
              `You are an official TCF Canada Expression Orale examiner. Evaluate my spoken transcript strictly against TCF Canada CLB 7 (B2, minimum 10/20) criteria.\n\n` +
              `TASK: ${task.taskNum} — ${task.title}\n` +
              `PROMPT:\n${task.prompt}\n\n` +
              `MY SPOKEN TRANSCRIPT / OUTLINE:\n${spoken}\n\n` +
              `Please give me:\n1. Estimated TCF EO score (/20) and CLB level.\n2. Natural French phrasing & grammar fixes.\n3. Two high-scoring B2 connectors or arguments I should add to pass CLB 7 comfortably.`;
            copyToClipboard(packet, btnCopyEO);
          };
        }

        const fullBtn = els.mainContent.querySelector(`[data-passage-play="eo_model_${task.id}"]`);
        if (fullBtn) fullBtn.onclick = () => playSequence(`eo_model_${task.id}`, task.modelSentences);
        els.mainContent.querySelectorAll(`[data-passage-id="eo_model_${task.id}"][data-sentence-row]`).forEach((row) => {
          row.onclick = () => {
            const idx = parseInt(row.dataset.sentenceRow, 10);
            stopAudio();
            state.activePassageId = `eo_model_${task.id}`;
            state.activeSentenceIdx = idx;
            const tok = ++state.playbackToken;
            state.isSpeaking = true;
            updateAudioUI();
            speakRaw(task.modelSentences[idx], {
              tok,
              onEnd: () => { if (tok === state.playbackToken) { state.isSpeaking = false; state.activeSpeakerLabel = ''; state.activePassageId = null; state.activeSentenceIdx = null; updateAudioUI(); } },
              onError: () => { if (tok === state.playbackToken) { state.isSpeaking = false; state.activeSpeakerLabel = ''; state.activePassageId = null; state.activeSentenceIdx = null; updateAudioUI(); } }
            });
          };
        });
        updateAudioUI();
      }

      /* =========================================================
         17. GLOBAL EVENTS & BOOTSTRAP
      ========================================================= */
      els.btnOpenSidebar.onclick = openMobileSidebar;
      els.btnCloseSidebar.onclick = closeMobileSidebar;
      els.mobileBackdrop.onclick = closeMobileSidebar;
      els.btnGlobalStop.onclick = stopAudio;
      els.btnDismissSpeechWarn.onclick = () => els.speechWarning.classList.add('hidden');

      els.sidebarLevelFilter.onchange = (e) => {
        state.sidebarLevelFilter = e.target.value;
        renderSidebar();
      };

      els.btnToggleZh.onclick = () => {
        state.showZh = !state.showZh;
        saveState();
        renderTopControls();
        renderMain();
      };

      els.speedBtns.forEach((btn) => {
        btn.onclick = () => {
          state.speed = parseFloat(btn.dataset.speed);
          saveState();
          renderTopControls();
          if (state.isSpeaking) stopAudio();
        };
      });

      els.voiceSelect.onchange = (e) => {
        state.selectedVoiceURI = e.target.value;
        saveState();
        stopAudio();
      };

      if (els.btnExportProgress) {
        els.btnExportProgress.onclick = () => {
          try {
            const blob = new Blob([JSON.stringify(serializeProgress(), null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tcf-canada-french-progress-${todayISO()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          } catch (e) {
            showSpeechWarn('Could not trigger file download in this browser.');
          }
        };
      }

      if (els.btnImportProgress && els.importProgressFile) {
        els.btnImportProgress.onclick = () => els.importProgressFile.click();
        els.importProgressFile.onchange = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(String(reader.result || '{}'));
              if (typeof data !== 'object' || data === null) throw new Error('Invalid');
              if (Array.isArray(data.completedChapters)) state.completedChapters = data.completedChapters;
              if (Array.isArray(data.completedGrammar)) state.completedGrammar = data.completedGrammar;
              if (Array.isArray(data.completedVocabLessons)) state.completedVocabLessons = data.completedVocabLessons;
              if (Array.isArray(data.mistakes)) state.mistakes = data.mistakes;
              if (Array.isArray(data.studyDays)) state.studyDays = data.studyDays;
              if (data.vocabSRS && typeof data.vocabSRS === 'object') state.vocabSRS = data.vocabSRS;
              if (data.quizAnswers && typeof data.quizAnswers === 'object') state.quizAnswers = data.quizAnswers;
              if (data.grammarQuizAnswers && typeof data.grammarQuizAnswers === 'object') state.grammarQuizAnswers = data.grammarQuizAnswers;
              if (data.vocabLessonQuizAnswers && typeof data.vocabLessonQuizAnswers === 'object') state.vocabLessonQuizAnswers = data.vocabLessonQuizAnswers;
              if (data.eeDrafts && typeof data.eeDrafts === 'object') state.eeDrafts = data.eeDrafts;
              if (typeof data.xp === 'number') state.xp = data.xp;
              if (typeof data.dailyHours === 'number') state.dailyHours = data.dailyHours;
              saveState();
              renderSidebar();
              renderMain();
              showSpeechWarn('✓ Progress restored cleanly from your backup file!');
            } catch (err) {
              showSpeechWarn('Could not import file — please choose a valid TCF Studio .json backup.');
            }
          };
          reader.readAsText(file);
          els.importProgressFile.value = '';
        };
      }

      els.btnResetProgress.onclick = () => {
        if (!confirm('Reset all saved grammar/vocab lessons, units, SRS mastery, mistakes, XP, and writing drafts?')) return;
        localStorage.removeItem(STORAGE_KEY);
        state.completedChapters = [];
        state.completedGrammar = [];
        state.completedVocabLessons = [];
        state.grammarQuizAnswers = {};
        state.vocabLessonQuizAnswers = {};
        state.mistakes = [];
        state.studyDays = [];
        state.vocabSRS = {};
        state.quizAnswers = {};
        state.eeDrafts = {};
        state.xp = 0;
        renderSidebar();
        renderMain();
      };

      window.addEventListener('beforeunload', () => {
        stopAudio();
        clearTimers();
      });

      function init() {
        renderTopControls();
        renderSidebar();
        renderMain();
        updateAudioUI();
        loadVoices();
        if (state.speechSupported && typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
      }

      
      // Standalone Light/Dark theme switcher
      (function setupTheme() {
        const key = "tcf_studio_theme_v1";
        const btn = document.getElementById("btnToggleTheme");
        const apply = (dark) => {
          document.documentElement.classList.toggle("dark", dark);
          if (btn) btn.textContent = dark ? "☀️" : "🌙";
        };
        const saved = localStorage.getItem(key);
        const initialDark = saved ? saved === "dark" : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        apply(initialDark);
        if (btn) {
          btn.onclick = () => {
            const next = !document.documentElement.classList.contains("dark");
            localStorage.setItem(key, next ? "dark" : "light");
            apply(next);
          };
        }
      })();

      init();
    })();
  </script>
</body>
</html>
